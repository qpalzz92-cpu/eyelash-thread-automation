  - id: notion-3aef83fe90bd81859a06c40c72d40e2a
    title: "💬 28. 제안 안 하는 건 배려가 아니라 손님 손해다"
    scheduled_at: "2026-08-26T21:00:00+09:00"
    approved: true
    body: |
