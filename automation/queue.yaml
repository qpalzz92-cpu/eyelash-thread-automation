  - id: notion-3aef83fe90bd81f69207fc12a76162d5
    title: "🧑‍🤝‍🧑 22. 모든 손님을 똑같이 대하다 진짜 단골을 놓쳤다"
    scheduled_at: "2026-08-18T21:00:00+09:00"
    approved: true
    body: |
      나는 모두를 똑같이 대하는 게
      공평한 거라고 믿었어.

      근데 매달 나를 먹여 살리는 단골도
      1년에 한 번 오는 손님이랑 똑같이 대했어.

      단골 입장에선 서운했을 거야.
      '이만큼 왔는데 특별할 게 없네' 하고.

      결국 오래된 단골 몇이 조용히 빠졌어.
      그제야 그들의 매출 비중을 봤어. 소름 돋았어.

      그때부터 단골을 따로 챙겼어.
      기억해주고, 먼저 챙기고, 작은 혜택을 줬어.

      공평함과 무심함은 달라.
      더 준 손님에겐 더 돌려주는 게 맞아.

      단골 관리 놓친 원장님 있으면 공유해줘.
    reply: |
