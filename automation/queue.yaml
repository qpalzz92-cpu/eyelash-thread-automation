posts:

  - id: notion-3a4f83fe90bd8167ad4edbf7f77e5c2a
    title: "⚠️ 1. 잘 벌어도 문 닫는 이유"
    scheduled_at: "2026-07-21T21:00:00+09:00"
    approved: true
    body: |
      1인샵은 안 돼서 문 닫는 줄 알지?

      아니야.
      돈 잘 버는데도 문 닫는 샵, 생각보다 많아.

      이유는 하나야.
      잘 벌 때 '다음'을 준비 안 했거든.

      혼자 다 짊어지고 굴리면
      버는 만큼 내 시간과 체력이 거기 다 묶여.
      내가 멈추면 매출도 멈추는 구조라 오래 못 가.

      진짜 위험한 순간은 '잘될 때'야.
      그때 다음 계단(브랜딩·시스템)을 올려놔야
      오래, 그리고 편하게 벌 수 있어.

      끝까지 살아남는 원장은
      잘될 때 이미 다음을 준비한 사람이더라.

      지금 잘되고 있어서 '다음'을 미루는 원장님 있으면
      이 글 꼭 공유해줘. 그때가 제일 위험하니까.
    reply: |
      잘될 때 다음을 준비하는 원장, 진짜 몇 없어.
      대부분 '바쁘니까 나중에' 하다가 그 타이밍을 놓쳐.
      다들 지금 '시술 말고' 시스템에 쓰는 시간이 하루에 얼마나 돼? 하나만 얘기해줘.

  - id: notion-3a4f83fe90bd8117835cf6fdb7b35dbb
    title: "📣 2. 광고 쓰기 전에 이것부터 - 후기 ⭐"
    scheduled_at: "2026-07-22T13:00:00+09:00"
    approved: true
    body: |
      광고에 돈 쓰기 전에, 이것부터 확인해.

      신규 손님이 안 오는 진짜 이유,
      실력이 아니라 '후기'일 때가 많아.

      사람들은 처음 가는 곳을
      남들 후기로 판단하거든.
      후기 없으면, 아무리 잘해도
      '그냥 모르는 샵'이야.

      잘되는 샵은 광고를 잘한 게 아니라
      '후기가 쌓이는 구조'를 만든 곳이이야.

      후기는 가장 오래가고
      제일 힘이 안들어가고
      제일 싼 광고야.
    reply: |
      지금 우리 샵, 후기 몇 개야?
      그 숫자가 신규를 정해. 후기 쌓는 법, 차차풀어가 볼게 🤍

  - id: notion-3a4f83fe90bd811cb4d7ebd6d63c678e
    title: "📅 3. 노쇼는 '전날'에 몰린다 (다들 여기서 실수해)"
    scheduled_at: "2026-07-22T21:00:00+09:00"
    approved: true
    body: |
      노쇼, 언제 제일 많이 나는지 알아?

      2주 뒤 예약이 펑크날 것 같지?
      아니야. 애초에 그렇게 멀리는 예약을 안 해.

      진짜 펑크는 '전날, 당일'에 몰려.
      마음이 딱 그때 바뀌거든.

      그래서 노쇼는 '예약금'보다
      '전날 관리'에서 갈려.

      근데 여기서 다들 좋은 뜻으로 하는 짓이
      오히려 취소율을 폭증시켜.

      이거 하나 모르면 매출 계속 새.
      전날 관리 고민인 원장님 있으면 공유해줘.
      그게 뭔지, 댓글에 적어둘게. 👇
    reply: |
      바로 '전날 리마인드 문자'야.

      근데 문제는 문자 내용이야. 대부분 "예약 확인차 연락드려요~ 못 오시면 말씀 주세요" 이렇게 보내지? 이게 취소 버튼을 눌러주는 거야. 사람 심리가, 취소할 명분을 안 주면 그냥 와. 근데 "못 오시면 미리 말씀 주세요"가 취소해도 된다는 허락이 돼버려.

      바꿔야 할 건 딱 하나. 확인을 '취소 안내'가 아니라 '준비 안내'로. "내일 ○시 예약, 원장님이 직접 준비해두고 기다릴게요. 시술 전 이건 피해주세요" 이런 식으로. 나를 위해 이미 뭔가 돌아가고 있다는 느낌을 주면 취소 문턱이 심리적으로 확 올라가. 없애야 할 문장을 없애고, 심어야 할 문장을 심는 거지.

      다들 샵 전날 문자, 지금 뭐라고 보내? 한 줄만 그대로 붙여줘.

  - id: notion-3a4f83fe90bd81ed87f0fe4804b95acf
    title: "🛡️ 4. 컴플레인 터졌을 때, 이 순서대로만 하면 돼"
    scheduled_at: "2026-07-23T13:00:00+09:00"
    approved: true
    body: |
      컴플레인 응대, 감정으로 하면 무조건 져. 순서가 있어.

      1. 끊지 말고 끝까지 듣기
         중간에 변명하면 불에 기름이야.

      2. 사실 여부보다 '감정' 먼저 인정
         "불편하셨겠어요." 이 한마디부터.
         (내 잘못 인정이 아니라 감정 공감이야)

      3. 바로 '대안' 제시
         재시술/부분 수정/다음 방문 혜택 등.
         사과만 하고 대안 없으면 손님은 더 화나.

      4. 마무리는 '고마움'
         "말씀해주셔서 감사해요, 개선하는데에 도움이 될 것 같아요 😊."

      핵심은 '방어하지 않기'.
      방어하는 순간 손님은 이기려고 들어.
      인정하고 대안 주면 오히려 단골 되는 경우도 많아.

      이 순서 저장해뒀다가 터졌을 때 그대로 써.
      컴플레인에 매번 흔들리는 원장님 있으면 공유해주고.
    reply: |
      진상과 진짜 컴플레인은 구분해야 해. 기준 하나.
      '해결책을 원하면' 진짜 손님, '이겨먹으려 들면' 진상.
      전자는 위 순서로 잡고, 후자는 정중히 선 긋고 보내. 다 잡으려다 나만 갈려.
      기억에 남는 컴플레인 응대 있어? 어떻게 풀었는지 하나만 들려줘.

  - id: notion-3a4f83fe90bd817293d3ec35d3c442a8
    title: "🛡️ 4. 제일 무서운 건 컴플레인 하는 손님이 아니야"
    scheduled_at: "2026-07-23T21:00:00+09:00"
    approved: true
    body: |
      불만 있는 손님, 말하고 갈 것 같지?
      아니야. 대부분 아무 말 없이 그냥 안 와.

      그리고 그 침묵한 손님은
      주변엔 다 말해. 나쁜 경험은 좋은 경험보다
      훨씬 빨리, 멀리 퍼지거든.

      즉 컴플레인을 '말해주는' 손님은
      사실 고마운 손님이야. 고칠 기회를 준 거니까.

      진짜 위험한 건 조용히 사라진 손님이고.
      말없이 떠난 손님이 매출을 갉아먹어.

      컴플레인 무서워하는 원장님 있으면 공유해줘.
      침묵을 막는 한마디, 댓글에 적어둘게. 👇
    reply: |
      그래서 나는 '컴플레인 잘 하게' 문을 열어둬.
      시술 끝에 "혹시 아쉬운 점 있으면 편하게 말해주세요." 별거 아닌 것 같은 이 한마디.

      방어하지 말고 이 문을 열어두는 게, 조용한 이탈을 막는 제일 싼 방법이야.
      다들 손님 불만, 어떻게 받는 편이야? 하나만 얘기해줘.

  - id: notion-3a4f83fe90bd8179a273d2d1e3fff562
    title: "🛡️ 4. 진상 막으려다 좋은 손님을 잃었다"
    scheduled_at: "2026-07-24T13:00:00+09:00"
    approved: true
    body: |
      진상 손님 하나 때문에
      가게 규정을 잔뜩 세게 만든 적이 있어.

      '이건 안 됩니다' 안내문 덕지덕지.
      근데 그거 보고 겁먹은 건
      진상이 아니라 착한 손님들이었어.

      정작 진상은 규정 있어도 진상 짓 하고,
      좋은 손님만 눈치 보다 발길 끊더라.

      그때 배웠어.
      진상은 '규정'으로 막는 게 아니라
      '초반에 안 맞는 손님을 정중히 거르는' 거라고.

      지금은 규정 대신 첫 상담에서 걸러.
      훨씬 조용하고 깔끔해.

      진상 때문에 규정만 늘리고 있는 원장님 있으면
      이 글 공유해줘. 방법이 반대야.
    reply: |
      사실 첫 상담 때 티가 나.
      이럴 때 무리해서 잡지 마. 안 맞는 손님을 정중히 보내는 것도 실력이야.

      '이건 진상이다' 싶은 신호 뭐 있어? 하나만 공유해줘.

  - id: notion-3a4f83fe90bd815a96d6d9be37faffa8
    title: "💰 5. 객단가 올리는 상담, 이 4단계로 말해봐"
    scheduled_at: "2026-07-24T21:00:00+09:00"
    approved: true
    body: |
      객단가는 '비싼 거 권하기'가 아니라 '진단하기'에서 올라. 멘트까지 줄게.

      1. 관찰 (말 걸기 전에)
         눈매, 기존 상태, 분위기 먼저 봐.

      2. 진단형 질문
         "평소에 아이라인 그리는 데 시간 얼마나 쓰세요?"
         → 니즈를 손님 입으로 꺼내게 해.

      3. 3옵션 제안 + 중간 추천
         "관리 편한 순으로 3가지 있는데,
          ○○님 라이프스타일엔 이 중간이 딱이에요."

      4. 이유 한 줄
         "이게 유지가 오래 가서 결국 더 경제적이에요."
         → 가격이 아니라 '가치'로 마무리.

      포인트: 손님이 '설득당했다'가 아니라
      '좋은 걸 알게 됐다'로 느끼게 하는 거야.
      강매는 한 번 팔고 끝, 진단은 단골을 만들어.

      이 스크립트 저장해두고 상담 때 그대로 써봐.
      객단가 안 올라 고민인 원장님 있으면 공유해주고.
    reply: |
      이 스크립트에서 제일 중요한 건 2번(진단형 질문)이야.
      손님이 스스로 '아 불편했지' 하고 니즈를 꺼내면, 제안은 그냥 받아들여져.
      우리 원장들 이 질문 하나 바꾸고 객단가가 눈에 띄게 올랐어.

      업종별(속눈썹·왁싱·피부) 진단 질문이 다르기 때문에 이 부분은 각자 더 공부해보자:)

  - id: notion-3a4f83fe90bd8152a3cff384a676bad8
    title: "💰 5. 선택지를 3개 주면, 손님은 중간을 고른다"
    scheduled_at: "2026-07-25T13:00:00+09:00"
    approved: true
    body: |
      사람은 '절대 가격'을 못 판단해. '비교'로만 판단해.

      그래서 메뉴를 하나만 보여주면
      비싼지 싼지 몰라서 망설여.
      근데 하·중·상 3개를 나란히 두면?
      대부분 '중간'을 골라.

      제일 싼 건 없어 보이고
      제일 비싼 건 부담되니까.

      객단가를 올리고 싶으면
      가격을 올리는 게 아니라
      '중간'을 내가 원하는 값에 세팅하면 돼.

      가격 올리기 무서운 원장님 있으면
      이 글 공유해줘. 방법이 따로 있어.
    reply: |
      이걸 실전에서 쓰는 법. 진짜 팔고 싶은 걸 '중간'에 놓고,
      그 위에 일부러 비싼 '상' 옵션을 하나 만들어. 안 팔려도 돼.

      그게 있어야 중간이 '합리적'으로 보이거든. 상 옵션은 중간을 팔기 위한 미끼야.
      샵 메뉴는 옵션이 한개라는 건 매출도 정해져있다는 뜻이야.

  - id: notion-3a4f83fe90bd81cf9494dcab0ecb61f5
    title: "💰 5. '뭐 해드릴까요?' 이 말이 내 매출을 깎고 있었다"
    scheduled_at: "2026-07-25T21:00:00+09:00"
    approved: true
    body: |
      예전엔 손님 오면 이렇게 물었어.
      "뭐 해드릴까요?"

      친절한 줄 알았지. 근데 그게
      내 객단가를 깎고 있었어.

      손님은 '자기가 아는 것'만 말하거든.
      제일 싼 기본 메뉴, 늘 하던 거.
      원장이 물어보면 손님이 메뉴를 짜는 셈이야.

      바꿨어. 묻는 대신 '진단'했어.
      눈매 보고, 라이프스타일 듣고
      "이런 게 더 어울리실 것 같아요" 먼저 제안.

      강매가 아니야. 손님은 몰랐던 선택지를 안 거고,
      객단가는 자연스럽게 올랐어.
      지금은 이 상담법을 원장들한테 매뉴얼로 가르쳐.

      '뭐 해드릴까요'로 객단가 새는 원장님 있으면
      이 글 공유해줘.
    reply: |
      한 끗 더. 제안할 때 옵션을 '3개'로 줘봐. 하 / 중 / 상.
      사람은 셋 중 대부분 '중간'을 골라. (제일 싼 것도, 제일 비싼 것도 부담이라)
      기본 하나만 보여주면 기본만 나가. 중간 객단가는 '3옵션'에서 나와.

      다들 상담할 때 어려운게 뭐야?

  - id: notion-3a4f83fe90bd8138bb39ceff24449c22
    title: "📱 6. 뭘 올려야 저장될까. 터지는 게시물 5종"
    scheduled_at: "2026-07-26T13:00:00+09:00"
    approved: true
    body: |
      시술 완성 사진만 올리고 있지? 그게 제일 안 터지는 축이야.
      저장·공유되는 건 따로 있어. 5종 정리해줄게.

      1. 비포 → 애프터 (변화)
         사람은 완성보다 '달라지는 순간'에 반응해.

      2. 과정/비하인드
         시술 클로즈업, 손놀림. '전문가처럼' 보여.

      3. 손님이 자주 묻는 질문 답변
         “펌 시술 후 바로 세안해도 되나요?" → 저장각.

      4. 실패·주의 사례
         "이런 눈엔 이 디자인 피하세요" → 신뢰 폭발.

      5. 관리 팁
         집에서 오래 유지하는 법. 저장 1등 유형.

      완성 사진은 '자랑'이고
      저장되는 건 '도움'이야.
      자랑 말고 도움을 올려.

      이 5종 저장해두고 하나씩 올려봐.
      피드 뭘 올릴지 막막한 원장님 있으면 공유해주고.
    reply: |
      하나만 더. 사진보다 '첫 줄 문구'가 저장을 정해.
      같은 비포애프터도 "속눈썹 연장"이라고 쓰면 안 눌러.
      "눈 처진 분들, 이 디자인만 피해도 인상 달라져요"처럼 '내 얘기네' 싶은 한 줄을 얹어. 저장률이 달라져.
      다들 어떤 게시물이 제일 잘 나왔어? 하나만 얘기해줘.

  - id: notion-3a4f83fe90bd81c39263d50f006d4199
    title: "📱 6. 도달은 팔로워가 아니라 '초기 반응 속도'가 정한다"
    scheduled_at: "2026-07-26T21:00:00+09:00"
    approved: true
    body: |
      '팔로워 적어서 안 보이는 거야' 
      이거 초보자가 가장 많이하는 오해야.

      요즘 알고리즘은 팔로워 수로 안 밀어줘.
      올리고 '처음 30분~1시간'에
      얼마나 빨리 반응(저장·댓글)이 오는지로
      더 퍼뜨릴지 말지를 정해.

      그래서 팔로워 1천인데 터지고
      1만인데 묻히는 일이 생기는 거야.

      숫자 키우는 데 힘 빼지 말고
      '초반 반응 잘 나오는 시간'에 올리고
      '반응할 만한 한 줄'을 넣어.

      팔로워 수에 기죽은 원장님 있으면
      이 글 공유해줘. 그거 상관없어.
    reply: |
      가장 쉬운 건 첫 댓글은 다들이 달아서 대화를 열어놔!

      반응 속도가 빨라져서 알고리즘이 더 밀어줘.

  - id: notion-3a4f83fe90bd81d687a7ebbaeef79df6
    title: "🎟️ 7. 선불 손님이 더 자주 오고 더 많이 쓴다"
    scheduled_at: "2026-07-27T13:00:00+09:00"
    approved: true
    body: |
      정기권은 '할인 손해'가 아니야. 남는 장사야.

      선불(정기권) 손님은
      · 이미 냈으니 안 오면 손해라 더 자주 오고
      · 올 때마다 추가 시술도 더 쉽게 붙여.

      즉 재방문율도, 객단가도 다 올라가.
      한 명한테서 나오는 총매출(LTV)이
      일반 손님보다 훨씬 커.

      눈앞의 할인율만 보면 손해 같지만
      '그 손님이 1년간 쓸 돈'으로 보면
      정기권이 이겨.

      할인율만 보고 정기권 망설이는 원장님 있으면
      이 글 공유해줘.
    reply: |
      매달 자동으로 오게 되니까 리텐션이 훨씬 높아지거든.

      헬스장이 왜 월 회원제인지 생각해봐. 우리도 그 구조를 쓸 수 있어.

  - id: notion-3a4f83fe90bd81d1be17f459876b44fc
    title: "🎟️ 7. 정기권을 '할인'으로 팔다가 샵만 싸 보였다"
    scheduled_at: "2026-07-27T21:00:00+09:00"
    approved: true
    body: |
      정기권 처음 만들 때
      '많이 깎아주면 사겠지' 했어.

      4회에 20% 할인. 팍팍 깎았지.
      근데 이상하게 안 팔리고
      샵만 싸구려처럼 보이더라.

      바꿨어. 할인을 확 줄이고
      대신 '편리함'을 팔았어.
      "매번 예약 안 잡아도 돼요, 오실 때 서비스로 블랙틴팅 해드려요."

      그랬더니 팔리기 시작했어.
      손님이 산 건 '할인'이 아니라
      '신경 안 써도 되는 편함'이었던 거야.

      정기권은 싸게 파는 게 아니라
      편하게 파는 거였어.

      정기권 안 팔려 고민인 원장님 있으면
      이 글 공유해줘.
    reply: |
      안 팔릴 때 진짜 이유는 대부분 하나야  손님이 '다 못 쓸까 봐' 부담스러운 거.
      유효기간을 넉넉히 열어주면 오히려 더 사고 더 자주 와.

      다들 정기권 어떻게 팔아? 하나만 알려줘.

  - id: notion-3a4f83fe90bd812ea886da0e139643eb
    title: "🔋 8. 안 무너지는 시스템 만들기 (휴식 말고 구조)"
    scheduled_at: "2026-07-28T13:00:00+09:00"
    approved: true
    body: |
      '쉬어라'는 말은 도움이 안 돼. 안 무너지는 '시스템’을 만들어야 해. 4가지야.

      1. 쉬는 날을 '먼저' 박기
         생기면 쉬는 게 아니라, 예약 안 받는 날을 달력에 미리.
         그날은 없는 사람이야.

      2. 반복 결정을 규칙으로
         가격·응대·발주… "이럴 땐 이렇게"로 정해둬.
         고민 자체를 없애.

      3. '나 아니어도 되는 일' 넘기기
         청소·정산·안내는 사람이든 툴이든 넘겨.
         원장이 할 일은 원장만 할 수 있는 것만.

      4. 회복도 일정에 넣기
         손님 예약처럼 '내 쉬는 시간'도 예약해.
         빈 시간에 쉬려 하면 영원히 못 쉬어.

      핵심:
      대신 이 쉬는날에 하루 일정시간은 온전히 ‘시스템’을 갖추는 시간에 써야해.

      의지로 버티지 말고 시스템으로 버텨.
      의지는 바닥나지만 시스템은 안 지쳐.

      이 4개 저장해두고 하나씩 박아봐.
      번아웃 직전인 원장님 있으면 공유해주고.
    reply: |
      이 4개 중 딱 하나만 먼저 하라면 '1번(쉬는 날 먼저 박기)'이야.

      대부분 원장은 '한가해지면 쉬어야지' 하는데, 그날은 영원히 안 와.
      쉬는 날을 먼저 정하고 거기 맞춰 예약을 받아. 순서만 바꿔도 삶이 바뀌어.

      이 쉬는날에는 일정시간은 꼭 ‘다음 단계’를 위한 시간으로 써야해.

      다들 마지막으로 제대로 쉰 게 언제야? 하나만 얘기해줘.

  - id: notion-3a4f83fe90bd81aa901dd3cfc459734f
    title: "🔋 8. 1인 원장을 태우는 건 노동이 아니라 '결정 피로'"
    scheduled_at: "2026-07-28T21:00:00+09:00"
    approved: true
    body: |
      왜 1인샵 원장이 유독 빨리 지칠까.

      일이 많아서? 아니야. '혼자 다 결정해서'야.
      사람은 하루에 내릴 수 있는 '좋은 결정' 양이 정해져 있어.
      그걸 다 쓰면 판단력도, 의욕도 뚝 떨어져.
      (결정 피로)

      근데 1인샵은 크고 작은 결정이 하루 수백 개.
       물어볼 데도 없고.

      몸보다 이 '결정 총량'이 원장을 태워.

      번아웃 온 원장님 있으면 이 글 공유해줘.
      게을러서가 아니라,
      전부 시스템이 안갖춰져있어서야.
    reply: |
      그래서 고수 원장은 '결정할 일 자체를 줄여'.

      아침 루틴, 가격, 응대, 재료 발주… 반복되는 건 다 규칙으로 박아두는 거지.

      '매번 고민'을 '한 번 정해두고 그냥 따름'으로 바꾸면, 같은 일을 해도 안 지쳐.
      다들 하루에 제일 자주 하는 결정이 뭐야? 하나만 얘기해줘.

  - id: notion-3a4f83fe90bd81669ea2daf3b71224de
    title: "🔋 8. 손이 아니라 '머리'가 먼저 지쳤다"
    scheduled_at: "2026-07-29T13:00:00+09:00"
    approved: true
    body: |
      번아웃 왔을 때, 난 몸이 문제인 줄 알았어.
      그래서 시술을 줄였지. 근데 안 나아지더라.

      알고 보니 문제는 몸이 아니라 '머리'였어.
      예약 몇 시에 받을지, 이건 얼마 받을지,
      저 손님 컴플레인 어떻게 할지…
      하루 종일 '결정'만 하고 있었던 거야.

      시술보다 그 '결정들'이 나를 태웠어.

      그래서 시술 시간을 줄이는 대신
      '결정할 일'을 줄였어.
      자주 하는 판단을 다 매뉴얼로 정해뒀지.
      "이럴 땐 이렇게" 규칙으로.

      머리가 쉬니까 그제야 번아웃이 풀리더라.

      요즘 이유 없이 지쳐 있는 원장님 있으면
      이 글 공유해줘. 몸이 아니라 머리일 수 있어.
    reply: |
      '쉰다'를 '아무것도 안 한다'로만 생각하지 마.
      진짜 회복은 '결정 안 해도 되는 상태'를 만드는 거야.
      매뉴얼 하나가 휴가보다 오래 가는 이유야.
      다들 요즘 뭐 때문에 제일 지쳐? 하나만 얘기해줘.

  - id: notion-3aef83fe90bd8190bddddbda08b60769
    title: "🧾 9. 가격 올렸더니 손님 '질'이 좋아졌다"
    scheduled_at: "2026-07-31T21:00:00+09:00"
    approved: true
    body: |
      싸게 받으면 손님이 늘 것 같지?

      내 경험은 반대였어.
      쌀 때 오던 손님이 제일 힘들게 했어.

      작은 것도 컴플레인, 노쇼도 잦고
      '더 깎아달라'는 말까지 나왔어.

      가격을 올리고 나서 이상한 일이 생겼어.
      진상은 알아서 빠지고, 내 기술을 알아보는 손님만 남았어.

      이유는 간단해.
      가격은 '누구를 받을지'를 거르는 필터거든.
      싸게 부르면 싸게 보는 사람이 오고,
      제값을 부르면 제값을 아는 사람이 와.

      가격은 매출만 정하는 게 아니야.
      내가 상대할 손님의 '수준'을 정해.

      아직도 저가로 버티는 원장님 있으면 이 글 보여줘.
    reply: |
      물론 그냥 올리면 안 되고, 올린 가격을 설명할 '이유'가 같이 있어야 해.
      재료 등급, 시술 시간, 사후관리. 뭐가 다른지 한 줄이라도 붙여봐.
      다들 가격 올린 뒤에 손님이 어떻게 바뀌었어? 경험 하나씩 적어줘.

  - id: notion-3aef83fe90bd81a0826fcfce6c145037
    title: "👥 10. 직원을 뽑았더니 더 힘들어졌다"
    scheduled_at: "2026-08-01T21:00:00+09:00"
    approved: true
    body: |
      혼자 다 못 하겠어서 직원을 뽑았어.
      이제 좀 편해지겠다 싶었지.

      웬걸, 더 바빠졌어.
      내 일 하랴, 가르치랴, 눈치 보랴.

      제일 힘든 건 '내 기준'이 그 사람한테 없다는 거였어.
      나는 당연한 걸 매번 설명해야 했어.

      뒤늦게 깨달았어.
      나는 '사람'을 뽑은 게 아니라
      '내 머릿속'을 통째로 옮기려 했던 거야. 그게 될 리가 없지.

      기준을 글로 만들고 나서야 달라졌어.
      말로 하던 걸 매뉴얼로 만드니 그제야 사람이 굴러갔어.

      직원은 '충원'이 아니라 '시스템'이야.
      내 기준이 글로 없으면, 사람을 뽑아도 내가 갈려.

      첫 직원 앞둔 원장님 있으면 공유해줘.
    reply: |
      뽑기 전에 딱 하나만 준비해. '이 샵은 이렇게 한다' 매뉴얼 한 장.
      응대 멘트, 시술 순서, 마감 체크. 이게 있으면 교육 시간이 반으로 줄어.
      다들 사람 때문에 제일 힘들었던 순간이 언제야? 하나만 알려줘

  - id: notion-3aef83fe90bd8171abd0d5d7d5cefed9
    title: "⏱️ 11. 예약을 꽉 채웠는데, 남는 게 없었다"
    scheduled_at: "2026-08-02T21:00:00+09:00"
    approved: true
    body: |
      한때 내 자랑은 '예약 꽉 참'이었어.
      아침부터 밤까지 손님이 끊이질 않았지.

      근데 통장을 보면 이상했어.
      이렇게 바쁜데 남는 게 별로 없더라.

      몸은 갈리는데 순이익은 안 늘고
      나는 점점 예민해지고 지쳐갔어.

      이유는 '싼 시술을 많이' 했기 때문이야.
      시간을 팔고 있었지, 기술을 판 게 아니었어.

      바꾼 건 하나야.
      예약 칸을 줄이고, 한 칸의 단가를 올렸어.
      손님은 반으로 줄었는데 순이익은 오히려 늘었어.

      꽉 찬 스케줄이 잘되는 게 아니야.
      '적게 일하고 많이 남기는' 구조가 잘되는 거야.

      풀예약이 목표인 원장님 있으면 공유해줘.
    reply: |
      체크 하나. 하루 매출을 '일한 시간'으로 나눠봐. 그게 진짜 내 시급이야.
      그 숫자가 알바보다 낮으면, 바쁜 게 아니라 갈리고 있는 거야.
      다들 하루에 '나를 위한 시간' 얼마나 있어? 하나만.

  - id: notion-3aef83fe90bd81569f45eedf5ba9403c
    title: "🏦 13. 원장 돈관리, 통장 4개로 시작해"
    scheduled_at: "2026-08-03T21:00:00+09:00"
    approved: true
    body: |
      돈관리가 막막하면 딱 이것부터 해.
      통장 4개로 쪼개는 거야.

      1. 매출 통장 (들어오는 돈)
         모든 매출은 일단 여기로. 여기서 절대 안 써.

      2. 고정비 통장
         월세, 재료비, 공과금. 매달 여기로 옮겨두고 여기서만 나가게.

      3. 세금 통장
         매출의 일정 비율을 미리 떼놔. 세금철에 안 흔들려.

      4. 내 월급 통장
         원장도 '월급'을 정해서 가져가. 남는 걸 쓰는 게 아니라, 정한 걸 써.

      돈이 섞이면 다 내 돈 같지만
      쪼개놓으면 진짜 남는 돈이 보여.

      이 4개 저장해두고 이번 달부터 세팅해봐.
      돈관리 막막한 원장님 있으면 공유해주고.
    reply: |
      순서 중요해. 매출 들어오면 → 세금 먼저 떼고 → 고정비 옮기고 → 내 월급, 남으면 저축.
      이 순서만 지켜도 '벌었는데 왜 없지?'가 사라져.
      다들 통장 관리, 제일 안 되던 게 뭐야? 하나만 얘기해줘.

  - id: notion-3aef83fe90bd818ca030c3a75bdd6c81
    title: "🏦 13. 매출은 느는데, 통장은 계속 비었다"
    scheduled_at: "2026-08-04T21:00:00+09:00"
    approved: true
    body: |
      매출이 오르면 부자가 되는 줄 알았어.
      숫자는 분명 커지는데, 통장은 늘 비어 있었어.

      재료 사고, 월세 내고, 카드값 막고 나면
      내 손에 남는 건 얼마 없더라.

      문제는 '매출'만 보고 있었던 거야.
      들어온 돈만 봤지, 나가는 돈이랑 남는 돈은 안 봤어.

      통장을 쪼개고 나서야 정신이 들었어.
      매출 통장, 고정비 통장, 세금 통장, 내 월급 통장.
      돈이 섞이니 다 내 돈처럼 느껴졌던 거였어.

      매출은 '허영'이고 순이익이 '진실'이야.
      남는 돈을 모르면, 아무리 벌어도 불안해.

      매출 숫자만 보고 있는 원장님 있으면 공유해줘.
    reply: |
      제일 먼저 할 건 '세금 통장' 분리야. 매출 들어오면 일정 비율을 바로 떼놔.
      이거 하나만 해도 세금 시즌에 무너지는 일이 없어져.
      다들 원장 되고 나서 돈관리, 어떻게 하고 있어? 하나만 알려줘

  - id: notion-3aef83fe90bd8112ad6ccdb463ce8243
    title: "🎯 14. 단골은 '기술'보다 '첫인상'에서 정해진다"
    scheduled_at: "2026-08-05T21:00:00+09:00"
    approved: true
    body: |
      단골은 기술이 제일 좋은 곳에 생긴다고 믿었어.
      틀렸어.

      손님은 기술의 미세한 차이를 잘 몰라.
      대신 '경험 전체'를 기억해.

      맞아주는 첫 인사
      편안한 상담
      끝나고 챙겨주는 한마디.

      기술이 90점이어도 이게 없으면
      손님은 60점짜리 친절한 샵으로 가.

      냉정하게 말하면
      단골은 '실력'이 아니라 '기분 좋은 경험'을 다시 사러 와.

      기술은 기본값이고
      단골을 만드는 건 그 위에 쌓는 경험이야.

      기술만 파고 경험을 놓친 원장님 있으면 이 글 보여줘.
    reply: |
      경험은 돈이 아니라 '디테일'이야. 이름 기억, 취향 기록, 지난 얘기 한마디.
      이게 대형샵이 못 따라오는 1인샵의 진짜 무기야.
      다들 손님이 '여기 좋다'고 한 포인트, 뭐였어? 하나만.

  - id: notion-3aef83fe90bd8136a0dfd956afb3da08
    title: "🏷️ 15. '왜 여기냐'는 질문에 답을 못 했다"
    scheduled_at: "2026-08-06T21:00:00+09:00"
    approved: true
    body: |
      손님이 물었어.
      "여기는 뭐가 달라요?"

      나는 대답을 못 했어.
      "친절하고 꼼꼼해요." 이 말밖에.

      근데 그건 다 하는 말이잖아.
      나만의 이유가 없었어.

      그래서 가격으로 경쟁했고
      나보다 싼 곳이 생기면 손님이 옮겨갔어.

      차별점이 없으면
      결국 남는 무기는 가격뿐이야.
      그건 제일 약한 무기야.

      나는 '누구를 위한 샵인지'부터 다시 정했어.
      모두가 아니라, 딱 한 종류의 손님에게 최고가 되기로.

      그때부터 '왜 여기냐'에 답할 수 있게 됐어.

      차별점이 없어 가격 경쟁만 하는 원장님 있으면 공유해줘.
    reply: |
      차별점은 거창한 게 아니야. '내가 제일 잘하는 디자인 한 종류' + '제일 잘 맞는 손님 한 종류'.
      이 둘을 좁히면 오히려 그 손님들이 몰려.
      다들 우리 샵만의 '한 끗' 뭐라고 생각해? 하나만.

  - id: notion-3aef83fe90bd817e80c5f95a6b5d0b14
    title: "👥 10. 사람을 못 믿어서, 내가 1인샵에 갇혔다"
    scheduled_at: "2026-08-07T21:00:00+09:00"
    approved: true
    body: |
      '내가 해야 마음이 놓인다.'
      이 말, 나도 입에 달고 살았어.

      근데 이게 나를 1인샵에 가둔 자물쇠였어.

      아무한테도 안 맡기니
      내가 멈추면 매출도 멈추더라.
      아파도 못 쉬고, 여행도 못 가.

      진짜 문제는 실력이 아니라 '기준'이었어.
      내 머릿속에만 있으니 남한테 못 넘긴 거야.

      기준을 밖으로 꺼내니 넘길 수 있는 일이 보였어.
      청소, 예약 안내, 정산. 이건 내가 아니어도 돼.
      원장은 원장만 할 수 있는 것에만 손을 쓰면 돼.

      혼자 다 잘하는 게 실력이 아니야.
      없어도 굴러가게 만드는 게 진짜 실력이야.

      다 짊어지고 있는 원장님 있으면 이 글 공유해줘.
    reply: |
      넘기는 연습은 '제일 안 중요한 일'부터야. 망해도 티 안 나는 것부터 넘겨봐.
      거기서 '어, 되네' 감이 오면 그다음이 쉬워져.
      '이건 나 아니어도 되는데' 싶은 일, 지금 딱 떠오르는 거 적어줘.

  - id: notion-3aef83fe90bd816a95f5e0748bdb25fc
    title: "🔁 12. 신규 10명보다 단골 1명이 세다"
    scheduled_at: "2026-08-08T21:00:00+09:00"
    approved: true
    body: |
      신규 손님이 많아야 잘되는 줄 알았어.
      아니야. 단골 한 명이 신규 열 명을 이겨.

      이유는 세 가지야.

      먼저, 단골은 광고비가 0원이야.
      데려오는 데 돈이 안 들어.

      둘째, 단골은 더 자주, 더 많이 써.
      나를 믿으니 비싼 시술도 맡겨.

      셋째, 단골이 손님을 데려와.
      '나 여기 다녀' 이 말 한마디가 최고의 광고야.

      신규는 '유지'가 안 되면 밑 빠진 독이지만
      단골은 시간이 갈수록 이자가 붙는 예금이야.

      광고에 쓸 힘의 절반만 단골에게 써봐.
      매출이 조용히, 그러나 단단하게 올라와.

      광고비만 늘리고 있는 원장님 있으면 이 글 보여줘.
    reply: |
      단골이 손님을 데려오게 하려면 '데려올 이유'를 주면 돼. 소개 시 둘 다 혜택.
      부탁하지 말고 설계해. 그게 훨씬 자연스럽고 세.
      소개로 온 손님이랑 그냥 온 손님, 뭐가 달라? 겪은 대로 풀어줘.

  - id: notion-3aef83fe90bd814a9c1ec5cfd2bd9b95
    title: "🗣️ 16. 소개는 '부탁'이 아니라 '설계'다"
    scheduled_at: "2026-08-09T21:00:00+09:00"
    approved: true
    body: |
      소개는 손님 마음에 달렸다고 생각했어.
      반은 맞고 반은 틀려.

      만족은 손님이 하지만
      소개가 나오는 '구조'는 내가 만들어.

      사람은 소개할 이유가 있어야 움직여.
      그냥 좋았다고 다 소개하진 않아.

      그래서 이유를 만들어줬어.
      소개한 손님도, 소개받은 손님도 둘 다 혜택.
      말하기 쉬운 한 줄 소개 문구도 미리 줬어.

      소개는 감동에 기대는 게 아니라
      '움직일 이유'를 설계하는 거야.

      부탁만 하고 소개가 안 오는 원장님 있으면 이 글 보여줘.
    reply: |
      핵심은 '둘 다 혜택'이야. 소개한 사람만 주면 부담스럽고, 받은 사람만 주면 티가 나.
      양쪽 다 챙기면 손님이 편하게 말을 꺼내.
      소개 이벤트 해본 적 있어? 반응 어땠는지 궁금해.

  - id: notion-3aef83fe90bd81e9851deb4f62b18632
    title: "🌟 17. 후기 잘 쌓는 4가지"
    scheduled_at: "2026-08-10T21:00:00+09:00"
    approved: true
    body: |
      후기는 운이 아니라 관리야. 이 4가지 해봐.

      1. 타이밍에 요청
         만족한 순간 바로. 며칠 지나면 안 써줘.

      2. 쉽게 만들어주기
         링크 하나, 짧아도 된다고. 장벽을 낮춰.

      3. 부정 후기엔 담담하게
         사과+개선 한 줄. 감정 빼고. 읽는 사람이 신뢰해.

      4. 좋은 후기는 다시 보여주기
         프로필, 상담 때 활용. 후기가 또 다른 손님을 불러.

      이 4개 저장해두고 하나씩 해봐.
      후기 관리 막막한 원장님 있으면 공유해주고.
    reply: |
      제일 약한 게 보통 1번(타이밍)이야. "다음에 써주세요"는 안 써져.
      그 자리에서, 그 기분일 때 부탁해야 남아.

  - id: notion-3aef83fe90bd8166b78ad551294d6153
    title: "🌟 17. 별점 하나에 밤새 잠 못 자던 시절"
    scheduled_at: "2026-08-11T21:00:00+09:00"
    approved: true
    body: |
      낮은 별점 하나에 하루가 무너졌어.
      100개 좋은 후기보다 나쁜 거 하나가 크게 보였어.

      감정적으로 대응했다가
      더 큰일로 번진 적도 있어.

      시간이 지나 깨달았어.
      리뷰는 나 보라고 쓴 게 아니야.
      '다음 손님'이 보라고 쓴 거야.

      그때부터 부정 리뷰에 감정 대신
      담담하고 성의 있게 답했어.
      화가 아니라 태도를 보여준 거야.

      신기하게도
      잘 대응한 부정 리뷰가
      오히려 '이 샵 믿을 만하네' 신뢰를 줬어.

      리뷰에 휘둘려 힘든 원장님 있으면 공유해줘.
    reply: |
      부정 리뷰 답변은 '그 사람'이 아니라 '읽는 사람'을 향해 써. 사과+개선+담담함.
      감정을 빼는 순간, 그 리뷰가 오히려 내 편이 돼.
      다들 악평 받았을 때 어떻게 대응해? 하나만.

  - id: notion-3aef83fe90bd81318bb7d37d9b1dba0e
    title: "🎁 18. 잘되는 샵은 '할인' 대신 '이유'를 판다"
    scheduled_at: "2026-08-12T21:00:00+09:00"
    approved: true
    body: |
      이벤트는 무조건 싸게 하는 건 줄 알았어.
      아니야.

      잘되는 샵의 이벤트엔 '이유'가 있어.
      계절, 리뉴얼, 감사, 신메뉴.

      이유가 있으면
      그건 할인이 아니라 '특별한 기회'가 돼.
      손님은 싸서가 아니라 '지금이라서' 와.

      이유 없이 그냥 싸게 하면
      '이 샵 원래 이 값이었나' 싶어져.

      같은 30% 혜택도
      '떨이'로 보이느냐 '기회'로 보이느냐는
      이유 한 줄에서 갈려.

      싸게만 거는 원장님 있으면 이 글 보여줘.
    reply: |
      이벤트엔 항상 '왜 지금'을 붙여. 기간도 짧게. 명분+마감이 있어야 움직여.
      상시 할인은 할인이 아니라 그냥 '내 가격'이 돼버려.
      제일 반응 좋았던 이벤트, 뭐였는지 자랑해줘.

  - id: notion-3aef83fe90bd810097ebcfa036a9688d
    title: "📖 19. 내가 없으면 샵이 안 돌아갔다"
    scheduled_at: "2026-08-13T21:00:00+09:00"
    approved: true
    body: |
      모든 걸 내 머릿속에 두고 일했어.
      응대도, 상담도, 마감도 다 나만 알았어.

      그래서 내가 없으면 아무것도 안 돌아갔어.
      아파도 못 쉬고, 자리를 못 비웠어.

      직원이 생겨도 소용없었어.
      물어볼 때마다 내가 붙어 있어야 했으니까.

      바꾼 건 '글로 남기기'였어.
      자주 받는 질문, 응대 멘트, 마감 순서.
      머릿속에 있던 걸 한 장씩 꺼냈어.

      그러니 나 없이도 샵이 돌기 시작했어.

      매뉴얼은 대기업만의 게 아니야.
      1인샵일수록 '나를 복제'해두는 게 살길이야.

      혼자 다 쥐고 있는 원장님 있으면 공유해줘.
    reply: |
      거창하게 말고 '자주 받는 질문 10개 + 답'부터 적어봐. 이게 첫 매뉴얼이야.
      한 장이 쌓이면 내가 붙어 있는 시간이 확 줄어.

  - id: notion-3aef83fe90bd81218a6fe427371f24e8
    title: "🧭 20. 매출 목표만 있는 건 목표가 아니다"
    scheduled_at: "2026-08-14T21:00:00+09:00"
    approved: true
    body: |
      '월 매출 얼마'
      이걸 목표라고 세웠어. 근데 안 움직였어.

      매출은 '결과'라
      그것만 보면 뭘 해야 할지 모르거든.

      목표는 '움직일 수 있는 것'으로 쪼개야 해.

      매출 = 손님 수 × 객단가 × 재방문.
      그럼 목표가 이렇게 바뀌어.
      신규 몇 명, 객단가 얼마, 재방문율 몇 %.

      이제 오늘 뭘 할지가 보여.
      막연한 매출 대신
      손에 잡히는 숫자 셋을 움직이는 거야.

      매출 숫자만 붙잡고 있는 원장님 있으면 이 글 보여줘.
    reply: |
      셋 중 제일 싸게 올릴 수 있는 건 '재방문율'이야. 신규 유치보다 돈이 훨씬 덜 들어.
      매출 올리고 싶으면 재방문부터 손봐.
      신규·객단가·재방문 중 지금 제일 약한 거, 하나 찍어줘.

  - id: notion-3aef83fe90bd8139a0c3de8eb6b21ed7
    title: "💳 21. 규칙이 명확한 샵이 오히려 진상이 없다"
    scheduled_at: "2026-08-15T21:00:00+09:00"
    approved: true
    body: |
      규칙을 세게 걸면
      손님이 부담스러워 떨어질 줄 알았어.

      반대였어.
      규칙이 명확한 샵일수록 진상이 없어.

      기준이 흐릿하면
      '되겠지' 하고 밀어붙이는 사람이 꼬여.

      기준이 분명하면
      상식적인 손님은 오히려 안심해.
      '여기 프로답다' 하고.

      무례한 손님은 알아서 걸러지고
      존중하는 손님만 남아.

      규칙은 벽이 아니라 필터야.
      좋은 손님을 지키는 울타리지.

      진상 때문에 힘든 원장님 있으면 이 글 보여줘.
    reply: |
      규칙은 '차갑게'가 아니라 '분명하게'야. 정중한 문장으로 명확히. 그게 프로의 태도야.
      애매하게 두면 결국 나도 손님도 피곤해져.
      규칙 세우고 손님 결이 달라진 적 있어? 경험 풀어줘.

  - id: notion-3aef83fe90bd816a8631ed3b99cf945e
    title: "💳 21. 정책이 없어서, 매번 손님한테 끌려다녔다"
    scheduled_at: "2026-08-16T21:00:00+09:00"
    approved: true
    body: |
      환불, 취소, 늦은 예약변경.
      정해둔 규칙이 없었어.

      그러니 매번 그 자리에서 판단했고
      손님이 세게 나오면 끌려다녔어.

      어떤 손님은 봐주고 어떤 손님은 안 봐주니
      '왜 나만' 소리가 나왔어.

      정책을 글로 정하고 나서 편해졌어.
      취소는 언제까지, 환불은 어떤 경우.
      기준이 있으니 감정 싸움이 사라졌어.

      규칙은 손님을 막으려는 게 아니야.
      나를 지키고, 모두를 공평하게 대하려는 거야.

      정책 없이 그때그때 판단하는 원장님 있으면 공유해줘.
    reply: |
      정책은 예약 전에 '미리' 안내하는 게 핵심이야. 문제 생기고 꺼내면 싸움이 돼.
