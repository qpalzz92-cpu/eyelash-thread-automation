      추가 제안할 때 쓰는 멘트, 있으면 공유해줘.

  - id: notion-3aef83fe90bd81a0b808d20443878a5a
    title: "💬 28. 추가 제안을 못 해서 남길 매출을 놓쳤다"
    scheduled_at: "2026-08-27T21:00:00+09:00"
    approved: true
    body: |
