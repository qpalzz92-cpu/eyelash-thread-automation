      밀린 단골 관리
      사진·포트폴리오 정리
      새 메뉴 준비, 배움.

      성수기가 '버는 시기'라면
      비수기는 '다음에 더 벌 준비를 하는 시기'야.

      비수기에 놀면 그냥 손해지만
      비수기에 씨를 뿌리면
      다음 성수기가 더 커져.

      비수기를 두려워만 하는 원장님 있으면 이 글 보여줘.
    reply: |
