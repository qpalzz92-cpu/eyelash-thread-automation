  - id: notion-3aef83fe90bd8187bd77ca03a26182aa
    title: "🚀 23. 확장 전 점검할 4가지"
    scheduled_at: "2026-08-19T21:00:00+09:00"
    approved: true
    body: |
      확장을 고민한다면 이 4가지부터 점검해.

      1. 나 없이 도는가
         내가 빠져도 굴러가는 시스템이 있나. 없으면 확장은 과부하야.

      2. 고정비를 감당할 매출인가
         늘어난 월세·인건비를 '지금' 매출로 감당 가능한지 계산해.

      3. 사람을 쓸 준비가 됐나
         매뉴얼, 교육 체계. 없으면 사람 늘려도 내가 갈려.

      4. 확장이 순이익을 늘리나
         매출 말고 '남는 돈'이 느는지. 규모만 커지고 실속 없으면 독이야.

      이 4개가 다 '예'일 때 확장해도 늦지 않아.
      규모 키우고 싶은 원장님 있으면 공유해주고.
    reply: |
      1번이 안 되면 나머지는 볼 필요도 없어. 나 없이 안 도는 상태에서 확장하면 지옥이 두 배가 돼.
      시스템부터, 규모는 그다음.
      지금 '나 없이' 샵이 며칠이나 돌 것 같아?

  - id: notion-3aef83fe90bd8144add6c4d6a45e6ac5
