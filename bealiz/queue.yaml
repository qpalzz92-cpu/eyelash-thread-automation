posts:

  - id: notion-3a4f83fe90bd81f3a5baf96a5147426b
    title: "🔒 1. 유지력 컴플레인이 반복된다면, 답은 우리 안에 있어 ⭐"
    scheduled_at: "2026-07-21T21:30:00+09:00"
    approved: true
    body: |
      유지력 컴플레인, 손님 탓하기 제일 쉽지.
      근데 냉정하게 보자.

      어쩌다 한 명은 손님 변수 맞아.
      근데 '반복적으로' 나온다면?
      그건 손님이 아니라 우리 샵 문제야.

      인정하기 싫어도 여기서부터 실력이 갈려.
      남 탓하면 계속 그 자리고,
      내 안에서 원인 찾으면 기술이 늘어.

      손님 관리 얘기 꺼내기 전에
      온습도·글루·전처리·기법부터 점검해.

      반복 컴플레인은 문제가 아니라 '신호'야.
      공짜로 주는 내 샵 점검 리스트인 셈이지.

      유지력 때문에 스트레스받는 선생님 있으면 공유해줘. 남 탓만 하다 지치거든.
    reply: |
      1·2·3번(온습도·글루·전처리)이 다 맞는데도 안 나오면? 답은 4번, 기법이야.
      핵심은 '밀착'. 원모(자연모)와 가모(연장모)가 확실히 밀착된 상태에서 글루가 '락인'돼야 오래가.
      다들 이 4개 중 어디가 제일 자신 없어? 하나만 말해줘.

  - id: notion-3a4f83fe90bd81459a64e60bf5857413
    title: "🌱 2. 속눈썹 창업 전, 기술 말고 준비할 4가지"
    scheduled_at: "2026-07-22T21:30:00+09:00"
    approved: true
    body: |
      창업 전에 기술만 준비하지? 그건 절반이야.
      기술 말고 이것부터 챙겨.

      1. 가격 기준
         "얼마 받을지"를 감으로 정하지 마. 이유를 붙여.

      2. 재방문 설계
         신규보다 '다시 오게' 만드는 게 먼저.

      3. 나만의 한 줄
         "왜 여기 와야 하는지" 한 문장으로 말 되게.

      4. 버티는 돈
         손님 없어도 몇 달 버틸 여유.
         이게 없으면 조급해져서 싸게 판다.

      기술은 학원이 가르쳐주지만
      이 4개는 아무도 안 가르쳐줘.
      근데 이게 창업의 생존을 정해.

      창업 준비하는 사람 있으면 저장해두라고 공유해줘.
    reply: |
      이 중 딱 하나만 먼저 하라면 '4번(버티는 돈)'이야.
      돈이 급하면 무조건 싸게 받게 되고, 싸게 받으면 몸이 갈리고, 그럼 오래 못 가.
      여유가 배짱을 만들고, 배짱이 제값을 받게 해.
      다들 이 4개 중 뭐가 제일 부족한 것 같아? 하나만 얘기해줘.

  - id: notion-3a4f83fe90bd811b8196ed3c6340ae95
    title: "🌱 2. 기술만 배우면 창업 성공한다는 착각 ⭐"
    scheduled_at: "2026-07-23T21:30:00+09:00"
    approved: true
    body: |
      속눈썹 창업, 기술만 좋으면 될 것 같지?
      아니야. 그건 입장권일 뿐이야.

      기술 좋은 원장, 널렸어.
      근데 그중 오래 가는 사람은 따로 있어.

      기술은 '시작'을 만들지
      '유지'를 만들진 않거든.

      같은 실력인데
      누구는 자리 잡고, 누구는 몇 달 만에 닫아.
      그 차이는 기술이 아니라
      가격·재방문·나만의 이유를 설계했느냐야.

      기술은 계속 갈고닦되,
      창업은 '기술 밖'을 준비한 사람이 이겨.

      기술만 파고 있는 예비 원장 있으면 이 글 공유해줘.
    reply: |
      오해하지 마. 기술 대충 하란 게 절대 아니야. 기술은 기본 중의 기본이야.
      근데 기술'만' 100점이고 나머지가 0점이면 그 샵은 안 굴러가.
      기술이 탄탄하면서 운영 준비도 같이 돼 있어야 살아남아.
      다들 창업 준비하면서 기술 말고 뭘 제일 신경 쓰고 있어?

  - id: notion-3a4f83fe90bd8113aa63ee4f50b14e48
    title: "💬 3. 디자인 상담, 이 순서로 하면 실패 안 해"
    scheduled_at: "2026-07-24T21:30:00+09:00"
    approved: true
    body: |
      디자인 상담, 감으로 하지 마. 순서가 있어.

      1. 원하는 것 듣기
         "어떤 느낌 원하세요?". 단어 말고 '느낌'을 물어.

      2. 눈매 관찰
         눈 크기·모양·자연모 상태·처짐 정도. 여기서 답 절반 나와.

      3. 라이프스타일 질문
         화장 습관, 관리 가능 시간. 유지 편한 디자인이 만족도 높아.

      4. 제안 + 이유
         "○○님은 이게 어울려요, 왜냐면~"
         이유를 붙이면 신뢰가 확 올라가.

      핵심: 손님이 '고른' 게 아니라
      '좋은 걸 알게 됐다'고 느끼게 하는 것.

      이 순서 저장해두고 상담 때 써봐. 상담 약한 선생님 있으면 공유해주고.
    reply: |
      제일 중요한 건 2번(눈매 관찰)이야. 근데 초보일수록 이걸 건너뛰고 손님 말만 들어.
      눈매를 3초만 봐도 "이 손님은 이게 안 어울리겠다"가 보여야 실력이 붙은 거야.
      다들 상담할 때 눈매에서 제일 먼저 뭘 봐? 하나만 얘기해줘.

  - id: notion-3a4f83fe90bd81cca3d8ee72d7835e28
    title: "💬 3. '손님이 원하는 대로'가 프로가 아니야 ⭐"
    scheduled_at: "2026-07-25T21:30:00+09:00"
    approved: true
    body: |
      손님이 원하는 대로 해주는 게
      서비스라고 생각하지?

      반은 맞고 반은 틀려.

      손님은 '결과'를 원하지
      '방법'을 아는 게 아니야.
      근데 방법까지 손님한테 맡기면
      결과가 아쉬워도 그건 네 실력으로 남아.

      "길게 해달라"는 말 뒤엔
      사실 "예뻐 보이고 싶다"가 있어.
      그걸 읽고 어울리는 길이를 짚어주는 게 프로야.

      손님 말을 '통역'하는 거야.
      말한 단어가 아니라, 원하는 진짜를.

      그래서 상담이 기술만큼 중요해.
      디자인은 시술 전에 이미 정해지거든.

      손님 말대로만 해서 결과 아쉬웠던 선생님 있으면 공유해줘.
    reply: |
      '통역' 잘하는 법 하나. 손님 말 듣고 바로 시작하지 말고, 딱 한 번 되물어.
      "평소에 화장 얼마나 하세요?" "관리에 시간 쓸 수 있어요?"
      이 두 개면 어울리는 디자인이 거의 나와. 라이프스타일이 디자인을 정하거든.
      다들 상담할 때 꼭 물어보는 질문 있어? 하나만 알려줘.

  - id: notion-3a4f83fe90bd8137b2fdff9e41ed676f
    title: "💬 3. 손님이 해달라는 대로 다 해줬더니 단골이 안 생겼다"
    scheduled_at: "2026-07-26T21:30:00+09:00"
    approved: true
    body: |
      처음엔 손님이 원하는 대로 다 해줬어.
      "자연스럽게요" 하면 자연스럽게,
      "길게요" 하면 길게.

      친절한 줄 알았지.
      근데 이상하게 재방문이 안 붙더라.

      이유를 나중에 알았어.
      손님은 '자기 눈에 뭐가 어울리는지' 몰라.
      그냥 아는 단어로 말하는 것뿐이야.

      그때부터 바꿨어.
      원하는 걸 듣되, 눈매를 보고
      "○○님은 이게 더 어울려요" 먼저 제안했어.

      그랬더니 결과가 예뻐지고
      "어떻게 이렇게 잘 아세요?" 소리 들으면서
      단골이 붙기 시작했어.

      시키는 대로만 하는 건 기사고,
      어울리는 걸 짚어주는 게 전문가야.

      손님 말대로만 해주고 있는 선생님 있으면 이 글 공유해줘.
    reply: |
      포인트는 '거절'이 아니라 '제안'이야.
      "그건 안 돼요"가 아니라 "그것도 좋은데, ○○님 눈엔 이게 더 살아요."
      손님 선택을 뺏는 게 아니라 더 나은 선택지를 얹는 거지.
      다들 손님이 원하는 디자인이랑 어울리는 게 다를 때 어떻게 풀어? 하나만 얘기해줘.

  - id: notion-3a4f83fe90bd81f592cad583bb70a2d3
    title: "📈 4. 실력 안 느는 정체기, 이렇게 뚫어"
    scheduled_at: "2026-07-27T21:30:00+09:00"
    approved: true
    body: |
      아무리 해도 실력이 안 는다? 정체기야. 4개로 뚫어.

      1. 내 작업물 기록
         매번 사진. 한 달 전이랑 비교해야 는 게 보여.

      2. 한 번에 하나만 고치기
         오늘은 '방향'만, 다음은 '간격'만.
         다 고치려면 하나도 안 고쳐져.

      3. 잘하는 사람 것과 비교
         막연한 감탄 말고 '차이'를 구체적으로.

      4. 리터치 때 복기
         내가 붙인 게 어떻게 남았나가 진짜 성적표.

      정체기는 못하는 게 아니라
      '다음 단계 직전'이라는 신호야.

      정체기로 답답한 선생님 있으면 저장하라고 공유해줘.
    reply: |
      딱 하나면 '2번(한 번에 하나만)'이야. 초보일수록 조급해서 다 잘하려다 다 어정쩡해져.
      이번 주는 '방향' 하나만 잡는다 정하고 그것만 봐. 하나 완성되면 다음으로.
      다들 지금 딱 하나 고친다면 뭘 고치고 싶어? 하나만 얘기해줘.

  - id: notion-3a4f83fe90bd81c7a86bc4b1917219ae
    title: "📈 4. 손 빠른 게 실력이라는 착각 ⭐"
    scheduled_at: "2026-07-28T21:30:00+09:00"
    approved: true
    body: |
      속도 빠른 게 실력인 줄 알지?
      아니야. 그건 '숙련'이지 '실력'이 아니야.

      빨리 붙이는데 유지가 안 되면
      그건 빨리 망치는 거야.

      속도는 정확도가 쌓이면 저절로 따라와.
      순서가 반대면 평생 빠르기만 하고 안 늘어.

      느려도 정확하게. 그게 결국 제일 빠른 길이야.

      근데 '왕초보' 때는 얘기가 완전 달라.
      그 기준은 댓글에 적어둘게 👇
    reply: |
      '왕초보'라면 반대로 해. 이땐 '많이 붙여보는 것'이 먼저야.
      한 명한테 10가닥 붙이고 끝내는 거랑, 100가닥을 붙여보는 건 손에 익는 속도가 완전히 달라.
      그러니 감이 잡히기 전까진 양으로 익혀.
      감이 온 다음이 진짜야. 한 명을 하더라도 '전체 디자인 흐름'을 읽을 줄 알아야 해. 거기서부터 정확도로 넘어가는 거지.
      다들 지금 '양'을 쌓는 단계야, '흐름'을 읽는 단계야? 하나만 얘기해줘.

  - id: notion-3a4f83fe90bd8193a9efd13f7708601b
    title: "📈 4. 연습만 죽어라 했는데 실력이 안 늘던 시절"
    scheduled_at: "2026-07-29T21:30:00+09:00"
    approved: true
    body: |
      나도 초반엔 연습만 죽어라 했어.
      하루에 몇 개씩, 손 아프게.

      근데 이상하게 실력이 딱 멈춘 구간이 왔어.
      양은 느는데 결과물은 그대로.

      그때 깨달은 게 있어.
      '많이'가 아니라 '피드백 있는' 연습이어야 늘더라.

      그냥 반복하면 틀린 습관을 굳히는 거야.
      뭘 틀리는지 모르고 100개 하면
      틀린 게 100개 쌓이는 거지.

      그래서 내 시술을 사진으로 남기고
      전이랑 비교했어. 뭐가 달라졌는지.

      연습량보다 '내 걸 볼 줄 아는 눈'이
      실력을 만들었어.

      연습해도 안 는다고 느끼는 선생님 있으면 이 글 공유해줘.
    reply: |
      제일 빨리 느는 법. 잘하는 사람 작업물이랑 내 걸 나란히 놓고 '차이'를 찾아.
      막연히 "더 잘하고 싶다" 말고, "나는 여기 결이 뜬다"처럼 구체적으로.
      차이를 못 보면 못 고쳐. 보는 순간 고쳐져.
      다들 요즘 실력에서 제일 답답한 부분이 뭐야? 하나만 얘기해줘.

  - id: notion-3a4f83fe90bd81fdabeac2737a019638
    title: "📸 5. 문의 부르는 시술 사진, 5가지만 지켜"
    scheduled_at: "2026-07-30T21:30:00+09:00"
    approved: true
    body: |
      시술 사진, 이 5개만 지켜도 문의가 달라져.

      1. 밝은 빛
         창가 자연광 최고. 어두우면 다 죽는다.

      2. 눈 아래 각도
         위에서 살짝 내려찍으면 눈매가 예쁘게 나와.

      3. 비포 → 애프터
         변화가 보여야 사람이 반응해.

      4. 클로즈업 한 컷
         결·컬이 보이는 디테일 샷. 전문가로 보여.

      5. 첫 줄 문구
         "속눈썹" 말고 "눈 처진 분들 이 컬 추천"처럼 '내 얘기' 싶게.

      시술은 실력, 사진은 '보이는 실력'이야.
      둘 다 챙겨야 손님이 와.

      저장해두고 다음 시술부터 써봐. 사진 고민인 선생님 있으면 공유해주고.
    reply: |
      5개 중 하나면 '1번(빛)'이야. 나머지 다 좋아도 어두우면 말짱 도루묵.
      폰 카메라도 밝은 창가에선 충분히 예쁘게 나와. 장비 탓하기 전에 자리부터 옮겨봐.
      다들 주로 어디서(어떤 빛에서) 사진 찍어? 하나만 얘기해줘.

  - id: notion-3a4f83fe90bd81bfa019ef5318bd261b
    title: "📸 5. 사진 못 찍으면 실력도 반토막이야 ⭐"
    scheduled_at: "2026-07-31T21:30:00+09:00"
    approved: true
    body: |
      "실력만 좋으면 손님은 알아서 와."
      반은 맞는데, SNS 시대엔 반은 틀려.

      손님이 널 처음 만나는 곳은
      시술대가 아니라 '사진'이야.

      아무리 잘해도
      사진에서 그게 안 보이면
      그 실력은 없는 거나 마찬가지야.

      억울하지? 근데 그게 현실이야.
      그러니 사진도 '기술'이라고 생각해.
      시술 오래 했으면 사진 몇 분은 투자해.

      잘 찍은 사진 한 장이
      광고보다 세게 손님을 데려와.

      사진을 대충 여기는 선생님 있으면 공유해줘.
    reply: |
      사진도 기술이라 연습하면 늘어. 딱 3개만. 밝은 빛 / 눈 아래 각도 / 배경 깔끔.
      이 3개만 지켜도 같은 시술이 두 배로 예뻐 보여.
      다들 사진 찍을 때 뭐가 제일 어려워? (조명? 각도? 편집?) 하나만 얘기해줘.

  - id: notion-3a4f83fe90bd8143b001d8ca598f727d
    title: "📸 5. 시술은 자신 있는데 왜 문의가 없을까 했더니"
    scheduled_at: "2026-08-01T21:30:00+09:00"
    approved: true
    body: |
      시술 실력은 늘었는데
      이상하게 SNS 문의가 없던 때가 있었어.

      한참 뒤에 알았어.
      문제는 실력이 아니라 '사진'이었어.

      똑같이 예쁘게 해놓고
      사진이 어두우면 그냥 그런 시술처럼 보이고
      잘 찍으면 실력이 두 배로 보이더라.

      손님은 시술대에 앉기 전엔
      내 사진으로만 나를 판단하잖아.

      그때부터 시술만큼 사진에 신경 썼어.
      조명, 각도, 눈 감은 컷 하나.
      문의가 그때부터 늘었어.

      실력은 시술대에서 증명하지만
      사진은 그 전에 나를 팔아.

      사진 대충 올리는 선생님 있으면 이 글 공유해줘.
    reply: |
      제일 크게 바뀐 건 '조명'이었어. 창가 자연광에서 눈 아래로 살짝.
      어두운 실내 형광등이 애써 한 시술을 제일 많이 죽여.
      비싼 장비보다 밝은 빛 하나가 사진을 살려.
      다들 시술 사진 찍을 때 제일 신경 쓰는 거 뭐야? 하나만 얘기해줘.

  - id: notion-3aef83fe90bd8168a5aedc984795ab8c
    title: "💸 6. 가격 올리기 전에 점검할 4가지"
    scheduled_at: "2026-08-09T21:30:00+09:00"
    approved: true
    body: |
      가격은 그냥 올리면 손님이 흔들려.
      올리기 전에 이 4가지부터 점검해.

      1. '왜 이 값인지' 한 줄 설명이 있나
         재료, 시간, 관리. 다른 점을 한 줄로 말할 수 있어야 해.

      2. 사진과 공간이 그 값에 어울리나
         가격보다 '보이는 것'이 허술하면 저항이 커.

      3. 신규부터 새 값으로 받고 있나
         기존 손님은 유예를 주되, 새 손님은 처음부터 새 값.

      4. 미안해하지 않을 자신이 있나
         사과하듯 올리면 손님도 불안해져. 담담하게.

      이 4개 저장해두고 하나씩 준비해봐.
      가격 올릴까 고민인 선생님 있으면 공유해주고.
    reply: |
      제일 자주 걸리는 건 4번이야. 미안한 티 내는 순간 손님이 흔들려.
      "이번에 조정했어요" 딱 이 톤이면 충분해.
      이 4개 중 지금 제일 자신 없는 번호, 찍어줘.

  - id: notion-3aef83fe90bd81ab8ed1c689d2b73b31
    title: "💸 6. 싼 가격은 손님도 나를 싸게 보게 한다"
    scheduled_at: "2026-08-11T21:30:00+09:00"
    approved: true
    body: |
      가격 경쟁은 끝이 없어.
      나보다 싼 샵은 늘 생기거든.

      그리고 이상하게, 쌀수록 손님은 더 함부로 대해.

      싼 가격이 이런 신호를 보내거든.
      '이 사람 기술은 이 정도 값이구나.'

      제값을 부르면 반대가 돼.
      함부로 대하던 손님은 빠지고
      기술을 알아보는 손님이 남아.

      가격은 숫자가 아니야.
      내 기술의 '자기소개'야.

      싸게 부르면 싸게 대접받고
      제값을 부르면 프로로 대접받아.

      가격 경쟁에 지쳐 있는 선생님 있으면 이 글 보여줘.
    reply: |
      제값을 부르려면 '보이는 것'부터 바꿔야 해. 사진, 공간, 상담 톤.
      기술이 같아도 이게 허술하면 손님은 싼 값을 기대해.
      가격 올린 뒤 손님 반응, 어떻게 달라졌어? 겪은 대로 풀어줘.

  - id: notion-3aef83fe90bd81c08118ed9fd5f02eaf
    title: "💸 6. 싸게 받다가, 나만 갈려나갔다"
    scheduled_at: "2026-08-13T21:30:00+09:00"
    approved: true
    body: |
      처음엔 싸게 받는 게 전략인 것 같지.
      가격이 낮으면 손님이 몰릴 거라고.

      근데 저가로 가면 결국 나만 갈려나가.

      싼 만큼 더 많이 받아야 하고
      몸은 두 배로 힘든데 통장은 그대로야.

      더 힘든 건 손님이야.
      싸게 온 손님일수록 더 깎아달라 하고
      작은 것에도 예민해.

      가격을 깎는 건 내 기술을 깎는 거야.
      낮은 가격은 손님도 내 기술을 낮게 보게 만들어.

      싸게 많이가 아니라
      제값 받고 제대로가 오래가는 길이야.

      저가로 버티고 있는 선생님 있으면 공유해줘.
    reply: |
      가격을 못 올리겠으면, 먼저 '내가 왜 이 값인지'를 한 줄로 설명할 수 있어야 해.
      그게 안 되면 가격이 아니라 '설명'이 없는 거야.
      지금 가격, 다들은 뭘 기준으로 정했어?

  - id: notion-3aef83fe90bd81db952ac68f01c6a26f
    title: "🔁 7. 재방문 부르는 관리 4가지"
    scheduled_at: "2026-08-15T21:30:00+09:00"
    approved: true
    body: |
      재방문은 운이 아니라 시스템이야.
      이 4가지만 해도 다시 오는 손님이 늘어.

      1. 그 자리에서 다음 예약
         나가면 잊혀져. 가시기 전에 날짜를 잡아.

      2. 시술 기록 남기기
         디자인, 길이, 컬. "지난번 그대로 해드릴까요?" 한마디가 감동이야.

      3. 리터치 시기 알림
         관리 주기쯤 문자 하나. 광고 아니라 '챙김'으로 느껴지게.

      4. 안 온 손님 한 번 붙잡기
         한동안 안 온 분께 안부 한 줄. 생각보다 많이 돌아와.

      이 4개 저장해두고 하나씩 세팅해봐.
      재방문 낮아 고민인 선생님 있으면 공유해주고.
    reply: |
      제일 세게 먹히는 건 1번이야. 문밖을 나가는 순간 재방문 확률이 뚝 떨어지거든.
      "다음엔 3주 뒤가 딱이에요" 하고 바로 잡아드려.
      이 4개 중 제일 잘 먹혔던 거, 번호로 알려줘.

  - id: notion-3aef83fe90bd8158965fe64163261d69
    title: "🔁 7. 재방문은 실력이 아니라 '관리'에서 갈린다"
    scheduled_at: "2026-08-17T21:30:00+09:00"
    approved: true
    body: |
      실력만 좋으면 손님이 알아서 다시 온다고들 생각해.
      착각이야.

      실력이 좋아도 관리를 안 하면
      손님은 더 부지런한 옆집으로 가.

      냉정하게 말하면
      손님은 '제일 잘하는 곳'이 아니라
      '자기를 챙겨주는 곳'에 남아.

      기억해주는 말 한마디
      때 맞춘 안부 문자 하나
      다음 예약을 잡아주는 습관.

      이 사소한 게 실력보다 재방문을 더 좌우해.

      기술만 파고 관리를 놓치면
      밑 빠진 독에 물 붓는 거야.

      신규만 쫓고 있는 선생님 있으면 이 글 보여줘.
    reply: |
      관리는 거창할 필요 없어. 지난 시술을 기록해뒀다가 다음에 한마디 얹으면 돼.
      "지난번 그 컬 잘 유지되셨어요?" 이 한 줄이 단골을 만들어.

  - id: notion-3aef83fe90bd812ba619d23169544544
    title: "🔁 7. 손님이 한 번 오고 안 오던 이유"
    scheduled_at: "2026-08-19T21:30:00+09:00"
    approved: true
    body: |
      시술은 자신 있다는 사람들 많아.
      근데 손님이 한 번 오고 다시 안 오지.

      다들 실력부터 의심해.
      '내 기술이 별로인가?'

      그게 아니야.
      기술이 아니라 '관리'가 없어서야.

      손님은 시술이 끝나는 순간 나를 잊어.
      다음에 언제 와야 하는지, 어떻게 관리하는지
      아무도 안 알려주면 그냥 안 와.

      딱 하나 바꿔봐.
      가시기 전에 다음 예약을 잡고
      리터치 시기쯤 안부 문자를 보내.

      재방문은 실력이 아니라
      '기억하게 만드는 관리'에서 갈려.

      실력은 좋은데 재방문이 안 오는 선생님 있으면 공유해줘.
    reply: |
      제일 쉬운 것부터. 가시기 전에 "3주 뒤가 딱 좋아요" 하고 그 자리에서 잡아드려.
      문밖으로 나가면 확률이 확 떨어지거든.
      재방문 잡는 나만의 비결, 있으면 하나 나눠줄래?

  - id: notion-3aef83fe90bd8185914adf5aac6acc0d
    title: "🧠 8. 슬럼프에서 빠져나오는 4가지"
    scheduled_at: "2026-08-24T21:30:00+09:00"
    approved: true
    body: |
      슬럼프는 의지로 이기는 게 아니야.
      방법으로 빠져나오는 거야. 4가지 해봐.

      1. 비교 대상을 '과거의 나'로
         남이 아니라 3개월 전 내 작업이랑 비교해. 거긴 분명 성장이 보여.

      2. 작업을 기록하고 다시 보기
         찍어두고 나중에 봐. 혼자 하는 최고의 피드백이야.

      3. 한 가지만 파기
         다 잘하려 말고, 이번 달은 '이것 하나'만. 폭보다 깊이.

      4. 잠깐 손 놓는 것도 전략
         번아웃일 땐 쉬는 게 후퇴가 아니야. 회복도 실력이야.

      이 4개 저장해두고 지금 상태에 맞는 걸 골라봐.
      슬럼프에 빠진 선생님 있으면 공유해주고.
    reply: |
      딱 하나면 1번(과거의 나와 비교)이야. 비교 방향만 바꿔도 마음이 반은 편해져.
      SNS 속 남이 아니라, 내 성장 곡선을 봐.
      이 4개 중 지금 나한테 필요한 거, 하나 골라봐.

  - id: notion-3aef83fe90bd812f84add7ec09462c8d
    title: "🧠 8. 정체기는 실력이 느는 신호야"
    scheduled_at: "2026-08-26T21:30:00+09:00"
    approved: true
    body: |
      실력이 안 느는 것 같아 답답한 시기.
      누구나 한 번씩 와.

      근데 이 정체기, 사실 좋은 신호야.

      정체기가 온다는 건
      쉬운 구간을 다 지났다는 뜻이거든.

      처음엔 뭘 배워도 쭉쭉 늘어. 기초라 그래.
      어느 순간 안 느는 것처럼 느껴지는 건
      이제 '디테일'의 영역에 들어왔기 때문이야.

      여기서 그만두는 사람과
      한 끗을 파고드는 사람이 갈려.

      안 느는 게 아니라
      티가 안 나게 깊어지고 있는 거야.

      정체기라 흔들리는 선생님 있으면 이 글 보여줘.
    reply: |
      정체기엔 '양'보다 '피드백'이야. 내 작업을 찍어서 냉정하게 다시 봐.
      혼자 100번 하는 것보다 한 번 제대로 짚는 게 더 늘어.
      정체기 어떻게 넘겼어? 다들 얘기 궁금해.

  - id: notion-3aef83fe90bd813aaeefc37598166d70
    title: "🧠 8. 남이랑 비교하다, 그만두고 싶던 시절"
    scheduled_at: "2026-08-28T21:30:00+09:00"
    approved: true
    body: |
      기술 배우는 사람들, 한 번씩 이 시기를 겪어.
      남들 작업만 좋아 보이고 내 건 초라해 보이는 시기.

      SNS를 열면
      화려한 작업 사진, 예약 꽉 찬 후기.
      볼수록 자기 작업이 작아 보여.

      그러다 손이 안 잡히기 시작해.
      비교가 실력까지 갉아먹는 거야.

      여기서 알아야 할 게 있어.
      지금 남의 '결과'랑 내 '과정'을 비교하는 거야.
      그건 애초에 질 수밖에 없는 싸움이야.

      비교 대상을 바꿔.
      옆 사람 말고, 3개월 전의 나.
      그것만 이기면 돼.

      비교는 끝이 없지만
      어제의 나를 이기는 건 끝이 있어.

      비교에 지쳐 있는 선생님 있으면 공유해줘.
    reply: |
      실전 팁 하나. 힘들 때 내 예전 작업 사진을 다시 봐. 분명히 늘어 있어.
      성장은 남이 아니라 '과거의 나'랑 비교할 때만 보이거든.
      슬럼프 왔을 때 어떻게 빠져나와? 경험 풀어줘.

  - id: notion-3aef83fe90bd81b2b6abed81e70a4284
    title: "🏠 9. 상권보다 중요한 건 따로 있다"
    scheduled_at: "2026-08-30T21:30:00+09:00"
    approved: true
    body: |
      창업 준비하면 다들 '상권'부터 봐.
      목 좋은 자리, 유동인구 많은 곳.

      근데 1인샵은 좀 달라.

      속눈썹은 지나가다 들어오는 업이 아니야.
      찾아서 예약하고 오는 업이지.

      그래서 비싼 1층 대로변보다
      조용해도 '다시 오게 만드는 실력과 관리'가 훨씬 세.

      실제로 골목 안 작은 샵인데
      단골로 꽉 찬 곳이 수두룩해.

      상권에 큰돈 쓰기 전에
      재방문 구조부터 만들어.
      그게 진짜 '자리'야.

      목 좋은 자리만 알아보는 선생님 있으면 이 글 보여줘.
    reply: |
      비싼 자리는 고정비가 커서 '매달 그만큼 더 벌어야' 본전이야. 그게 초반엔 독이 돼.
      작게 시작해서 단골로 채우고 넓히는 게 훨씬 안전해.
      창업 때 자리, 뭘 기준으로 골랐어(고를 거야)?

  - id: notion-3aef83fe90bd815b9d52f6967e3cff5b
    title: "🏠 9. 준비 없이 오픈했다가 크게 고생했다"
    scheduled_at: "2026-09-01T21:30:00+09:00"
    approved: true
    body: |
      기술만 좋으면 창업은 되는 줄 알고
      덜컥 오픈하는 사람 많아.

      현실은 달라.
      시술 말고 할 일이 산더미거든.

      예약 관리, 손님 응대, 세금, 재료 발주, SNS.
      아무도 안 알려줘서 하나하나 깨지며 배워.

      제일 힘든 건 '물어볼 사람이 없다'는 거야.
      혼자라 실수도 온전히 자기 몫이지.

      기술은 딱 절반이야.
      나머지 절반은 '운영'인데
      그걸 준비 안 하고 뛰어들면
      오픈하고 나서 다 배워야 해. 그게 제일 비싸.

      창업 준비 중인 선생님 있으면 공유해줘.
    reply: |
      오픈 전에 딱 하나 준비하라면 '돈 계획'이야. 초기 몇 달은 매출이 들쭉날쭉이거든.
      최소 3개월 버틸 생활비를 따로 두고 시작해. 마음이 완전히 달라져.
      오픈하고 '이건 미리 알았어야' 싶은 거, 뭐 있어?

  - id: notion-3aef83fe90bd813391f3c5a01dab62a9
    title: "📚 10. 교육 고를 때 볼 4가지"
    scheduled_at: "2026-09-03T21:30:00+09:00"
    approved: true
    body: |
      교육은 비싸다고 좋은 게 아니야.
      고를 때 이 4가지를 봐.

      1. 실습 비중
         이론만 길고 실습이 적으면 손에 안 남아. 직접 해보는 시간이 중요해.

      2. 사후 피드백이 되나
         끝나고도 질문하고 봐줄 수 있는 곳. 한 번 듣고 끝은 금방 잊혀져.

      3. 내 단계에 맞나
         왕초보인데 고급반, 실무자인데 기초반. 단계가 안 맞으면 돈 낭비야.

      4. 실제 후기(작업 결과)
         화려한 홍보 말고, 수강생의 '전후 실력'을 봐.

      이 4개 저장해두고 강의 비교할 때 대봐.
    reply: |
      제일 중요한 건 2번(사후 피드백)이야.
      배움은 '듣는 순간'이 아니라 '해보고 막힐 때' 완성되거든.
      그때 물어볼 데가 있느냐가 실력 차이를 만들어.
      다들이 교육에서 제일 중요하게 보는 거, 뭐야?

  - id: notion-3aef83fe90bd8157a885edf226022207
    title: "📚 10. 자격증 개수는 실력이 아니야"
    scheduled_at: "2026-09-05T21:30:00+09:00"
    approved: true
    body: |
      자격증이 많으면 실력자인 것 같지?
      아니야.

      손님은 자격증을 안 봐.
      '작업 결과'를 봐.

      자격증 열 개보다
      만족해서 다시 오는 단골 한 명이
      실력을 더 정확하게 증명해.

      교육은 '입구'일 뿐이야.
      배운 걸 손에 익히고
      실전에서 될 때까지 반복해야 실력이 돼.

      그래서 교육을 고를 땐
      '뭘 배우냐'보다
      '배운 걸 연습하고 피드백받을 수 있냐'를 봐야 해.
    reply: |
      좋은 교육의 기준 하나. 끝나고 나서도 '질문하고 피드백받을 수 있는가'.
      한 번 듣고 끝인 강의는 배운 게 손에 안 남아.
      교육 고를 때 뭘 제일 봐? 나만의 기준 있어?

  - id: notion-3aef83fe90bd8151add5cff744574d49
    title: "⏰ 11. 정확도만 붙잡다가, 실력이 안 늘던 왕초보 시절"
    scheduled_at: "2026-09-07T21:30:00+09:00"
    approved: true
    body: |
      왕초보 때 한 명을 완벽하게만 붙이려는 사람 많아.
      한 가닥 한 가닥 신중하게, 오래.

      근데 이상하게 실력이 잘 안 늘어.
      느리기만 하고 감이 안 와.

      왕초보 땐 반대로 가야 해.
      감을 익히기 전엔
      '많이 붙여보는 것'이 먼저야.

      한 명한테 10가닥 하는 거랑
      100가닥 하는 건
      손에 익는 속도가 완전히 달라.

      정확도는 그다음이야.
      손이 방향을 기억할 만큼 반복하고
      감이 온 뒤에 디테일을 잡는 순서지.
    reply: |
      오해하면 안 되는 건, '대충 많이'가 아니야. 감을 만들 만큼 '충분히' 붙여보라는 거야.
      손이 방향을 기억하는 단계를 빨리 통과하는 게 왕초보의 숙제야.
      다들 초보 때 하루에 몇 명, 몇 가닥씩 연습했어?

  - id: notion-3aef83fe90bd81f9bf58e39eb3c53565
    title: "⏰ 11. 초보 연습, 단계별로 이렇게"
    scheduled_at: "2026-08-25T21:30:00+09:00"
    approved: true
    body: |
      실력이 안 느는 것 같으면
      연습을 '단계'에 맞춰봐.

      1. 왕초보: 양부터
         감이 없을 땐 많이 붙여보는 게 먼저. 손이 방향을 기억하게.

      2. 감이 온 뒤: 흐름 읽기
         한 명을 하더라도 전체 디자인 균형을 보는 눈을 길러.

      3. 그다음: 정확도
         숙련되면 속도는 따라와. 이때부터 디테일을 잡아.

      4. 항상: 내 작업 다시 보기
         찍어두고 냉정하게 보기. 혼자 하는 최고의 피드백이야.

      순서를 건너뛰면 오래 헤매.
      연습 방향이 막막한 선생님 있으면 공유해주고.
    reply: |
      제일 많이 하는 실수가 1번을 건너뛰고 3번부터 하는 거야.
      감도 없이 정확도를 쫓으면 지쳐.
      내 단계를 인정하는 게 성장의 시작이야.
      연습할 때 제일 고민되는 게 뭐야?

  - id: notion-3aef83fe90bd813eab45e46c4ef90394
    title: "⏰ 11. 왕초보와 경력자는 연습법이 반대여야 한다"
    scheduled_at: "2026-08-27T21:30:00+09:00"
    approved: true
    body: |
      '무조건 정확하게'가 정답인 것 같지?
      단계에 따라 달라.

      경력자는 정확도가 먼저야.
      속도는 숙련되면 알아서 따라오니까.

      근데 왕초보는 반대야.
      감이 아직 없어서
      정확도를 논하기엔 이른 단계거든.

      이때는 '많이 붙여보는 양'이 감을 만들어.
      손이 방향과 힘을 기억할 때까지.

      감이 온 다음엔 태도를 바꿔야 해.
      한 명을 하더라도
      전체 디자인 흐름을 읽는 눈으로.

      같은 '연습'도
      단계에 안 맞으면 헛돌아.

      단계에 안 맞는 연습으로 헤매는 선생님 있으면 이 글 보여줘.
    reply: |
      내 단계 구분법. 붙일 때 '어디에 어떻게'가 손에 안 잡히면 아직 양의 단계.
      손은 아는데 '전체 균형'이 고민되기 시작하면 정확도 단계로 넘어온 거야.
      지금 다들은 '양' 단계야 '정확도' 단계야?

  - id: notion-3aef83fe90bd81ce827be7aa9c6372e2
    title: "👁️ 12. 가닥은 완벽한데, 전체가 안 예쁘던 이유"
    scheduled_at: "2026-08-29T21:30:00+09:00"
    approved: true
    body: |
      한 가닥 한 가닥은 신경 써서 붙이는데
      다 하고 보면 뭔가 아쉬운 경우 많아.

      부분은 완벽한데 전체가 안 예뻐.

      이유는 하나야.
      '가닥'만 보고 '흐름'을 안 봐서야.

      눈은 부분이 아니라 전체를 봐.
      길이의 흐름, 좌우 균형, 얼굴과의 조화.
      이게 안 맞으면 가닥이 아무리 좋아도 아쉬워.

      그래서 감이 온 뒤부턴
      한 가닥을 붙일 때도
      '전체 그림 속 이 자리'로 봐야 해.

      거기서 결과가 갈려.

      부분만 파고 전체를 놓치는 선생님 있으면 공유해줘.
    reply: |
      연습 하나. 시술 중간중간 멀리서 전체를 봐. 코앞만 보면 흐름을 놓쳐.
      부분의 합이 아니라 '전체의 그림'이 디자인이야.
      시술할 때 전체 확인, 다들은 언제 해?
