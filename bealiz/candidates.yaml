    body: |
      시술은 자신 있었어.
      근데 손님이 한 번 오고 다시 안 왔어.

      한동안 내 실력을 의심했어.
      '내 기술이 별로인가?'

      아니었어.
      기술이 아니라 '관리'가 없던 거였어.

      손님은 시술이 끝나는 순간 나를 잊어.
      다음에 언제 와야 하는지, 어떻게 관리하는지
      아무도 안 알려주면 그냥 안 와.

      바꾼 건 딱 하나야.
      가시기 전에 다음 예약을 잡고
      리터치 시기쯤 안부 문자를 보냈어.

      재방문은 실력이 아니라
      '기억하게 만드는 관리'에서 갈려.

      실력은 좋은데 재방문이 안 오는 선생님 있으면 공유해줘.
    reply: |
