    topic: "가격/저가경쟁(정보): 가격 인상 전 체크리스트. 저장각. 6원칙: 훅=정보, 저장각=4체크, 공유=인상 앞둔 기술자, 댓글=제일 걸리는 것. 비기술 안전주제."
    body: |
      가격은 그냥 올리면 손님이 흔들려.
      올리기 전에 이 4가지부터 점검해.

      1. '왜 이 값인지' 한 줄 설명이 있나
         재료, 시간, 관리. 다른 점을 한 줄로 말할 수 있어야 해.

      2. 사진과 공간이 그 값에 어울리나
         가격보다 '보이는 것'이 허술하면 저항이 커.

      3. 신규부터 새 값으로 받고 있나
         기존 손님은 유예를 주되, 새 손님은 처음부터 새 값.

      4. 미안해하지 않을 자신이 있나
         사과하듯 올리면 손님도 불안해져. 담담하게.

      이 4개 저장해두고 하나씩 준비해봐.
      가격 올릴까 고민인 선생님 있으면 공유해주고.
    reply: |
