      그 사이 덜 알려도 잘 알리는 사람에게
      손님이 갔어.

      바꾼 건 '꾸준히 보여주기'였어.
      과장이 아니라 진짜 내 작업, 내 생각을
      조금씩 세상에 내놨어.

      부끄러움을 이기니 기회가 왔어.

      겸손과 숨김은 달라.
      실력은 '보여야' 기회가 돼.

      나를 알리기 어려운 선생님 있으면 공유해줘.
    reply: |
      브랜딩은 자랑이 아니라 '기록'이야. 오늘 작업, 오늘 생각을 꾸준히 남기면 그게 쌓여 신뢰가 돼.
      완벽할 때 시작하려면 영영 못 해. 지금부터 조금씩.
      나 알리는 거, 뭐가 제일 어려워?
  - key: personalbrand-real
    title: "🪞 20. 실력은 '보여야' 실력이 된다"
    category: 마케팅
    variant: 반전형+비밀공개형
    recommended: true
    topic: "퍼스널 브랜딩(반전): 알려지지 않은 실력은 없는 것과 같다. 비기술 안전주제. 흐름=통념→반전→이유→기준→결론."
    body: |
      '실력만 좋으면 언젠간 알아주겠지.'
      나도 이 말을 믿었어.

      냉정하게, 세상은 그렇게 안 굴러가.

      손님은 실력 있는 사람이 아니라
      '실력 있어 보이는, 아는 사람'에게 가.

      아무리 잘해도
      안 보이면 선택지에 없어.

      그래서 실력만큼 중요한 게
      그 실력을 '꾸준히 보여주는' 거야.

      과장하란 게 아니야.
      진짜를 성실하게 알리는 거지.

      숨은 실력자는 멋있지만
      기회는 보이는 사람에게 가.

      실력을 숨기고 있는 선생님 있으면 이 글 보여줘.
    reply: |
      하루 하나면 돼. 작업 사진 하나, 짧은 생각 하나. 1년이면 아무도 못 따라올 기록이 쌓여.
      브랜딩은 재능이 아니라 꾸준함이야.
      브랜딩, 다들은 어디서부터 막혀?
  - key: personalbrand-info
    title: "🪞 20. 나를 알리는 브랜딩 4단계"
    category: 마케팅
    variant: 정보성형+숫자형
    recommended: false
    topic: "퍼스널 브랜딩(정보): 브랜딩 시작 체크리스트. 비기술 안전주제. 저장각=4단계."
    body: |
      브랜딩이 막막하면 이 4단계로 시작해.

      1. 하나로 각인
         '무슨 디자인 하면 이 사람'. 다 잘한다 말고 하나로.

      2. 꾸준히 기록
         작업·생각을 매일 조금씩. 완벽 말고 지속.

      3. 사람도 보여주기
         결과만 말고 나의 태도·이야기도. 손님은 사람을 믿어.

      4. 한 채널에 집중
         여러 개 벌이지 말고 하나부터 제대로.

      이 4개면 무명에서 벗어나기 시작해.
      브랜딩 막막한 선생님 있으면 공유해주고.
    reply: |
      제일 흔한 실수가 4번을 어겨서 여기저기 벌이다 지치는 거야. 하나부터 꾸준히가 이겨.
      채널이 많은 게 아니라 '꾸준한 채널 하나'가 세.
      어느 채널로 나를 알려? 하나 알려줘.
  - key: confidence-story
    title: "😌 21. 손님 앞에서 손이 떨리던 초보 시절"
    category: 창업
    variant: 실패경험형+반전형
    recommended: false
    topic: "자신감/긴장(스토리): 초보의 긴장 극복 과정. 비기술(멘탈) 안전주제. 흐름=불안→위축→깨달음→방법→결론."
    body: |
      초보 때 손님 앞에만 서면 긴장했어.
      '못하면 어쩌지' 생각에 손이 굳었어.

      긴장하니 실수하고
      실수하니 더 위축되고.
      악순환이었어.

      손님도 그 불안을 느꼈어.
      내가 자신 없으니 손님도 나를 못 믿었어.

      바꾼 건 '준비'였어.
      긴장은 실력 부족이 아니라
      '준비 부족'에서 컸어.

      시술 순서를 몸에 익히고
      멘트를 미리 정해두니
      떨림이 줄었어.

      자신감은 성격이 아니라
      '충분히 준비했다는 확신'에서 왔어.

      손님 앞에서 떨리는 선생님 있으면 공유해줘.
    reply: |
      긴장될 땐 '완벽'을 목표로 하지 마. '준비한 대로만 하자'로 바꿔.
      결과 말고 과정에 집중하면 손이 덜 떨려.
      초보 때 긴장, 다들은 어떻게 이겨냈어?
  - key: confidence-real
    title: "😌 21. 자신감은 성격이 아니라 '준비'에서 온다"
    category: 창업
    variant: 반전형+비밀공개형
    recommended: true
    topic: "자신감/긴장(반전): 자신감=타고난 게 아니라 준비의 결과. 비기술 안전주제. 흐름=통념→반전→이유→기준→결론."
    body: |
      자신감은 타고나는 줄 알았어.
      나는 소심해서 안 되는 줄.

      아니었어.
      자신감은 성격이 아니라 '준비의 결과'였어.

      준비가 부족하면
      아무리 대범한 사람도 떨려.
      준비가 충분하면
      소심한 사람도 담담해져.

      손님은 내 성격을 안 봐.
      내가 '확신을 갖고 하는가'를 느껴.

      그 확신은
      순서를 익히고, 상황을 대비하고
      손이 기억할 때까지 반복한 데서 와.

      떨림을 없애는 건 배짱이 아니라
      준비의 두께야.

      성격 탓만 하는 선생님 있으면 이 글 보여줘.
    reply: |
      떨리는 상황 하나를 정해서 그 대응만 미리 연습해봐. '손님이 아파하면 이렇게' 처럼.
      대비된 상황은 안 떨려. 자신감은 그렇게 쌓여.
      어떤 순간에 제일 긴장돼? 솔직하게 적어봐.
  - key: confidence-info
    title: "😌 21. 손님 앞 긴장 줄이는 4가지"
    category: 창업
    variant: 정보성형+숫자형
    recommended: false
    topic: "자신감/긴장(정보): 긴장 완화 체크리스트. 비기술 안전주제. 저장각=4가지."
    body: |
      긴장도 관리하는 방법이 있어. 이 4가지 해봐.

      1. 순서를 몸에 익히기
         생각 안 해도 손이 가게. 준비가 떨림을 줄여.

      2. 멘트 미리 정하기
         인사, 상담, 마무리를 정해두면 말문이 안 막혀.

      3. 상황별 대응 연습
         아파할 때, 컴플레인 때. 대비된 상황은 안 떨려.

      4. 결과 말고 과정에 집중
         '완벽'이 아니라 '준비한 대로'. 부담을 낮춰.

      이 4개면 초보의 떨림이 확 줄어.
      긴장으로 힘든 선생님 있으면 공유해주고.
    reply: |
      2번(멘트)이 은근 효과 커. 말이 막히면 더 긴장되거든. 첫마디만 정해둬도 흐름이 잡혀.
      준비가 두꺼울수록 떨림은 얇아져.
      긴장 풀리는 나만의 방법, 있으면 공유해줘.
  - key: interview-story
    title: "🌟 22. 면접에서 기술만 말하다 떨어졌다"
    category: 창업
    variant: 실패경험형+반전형
    recommended: false
    topic: "첫 취업/면접(스토리): 기술만 어필하다 태도를 놓침. 비기술(취업) 안전주제. 흐름=자신→탈락→깨달음→방법→결론."
    body: |
      샵 면접에서 기술만 열심히 어필했어.
      '나 이만큼 할 수 있다'고.

      근데 떨어졌어.
      나보다 실력이 부족해 보이는 사람이 붙었어.

      나중에 알았어.
      원장이 보는 건 기술만이 아니었어.

      함께 일할 사람인가.
      손님을 어떻게 대할까.
      배우려는 태도가 있나.

      기술은 '기본'이고
      뽑는 결정은 '태도'에서 났어.

      다음 면접에선 바꿨어.
      실력은 담담히 보여주고
      함께 일하고 싶은 사람이라는 걸 보여줬어.

      그때 붙었어.

      면접이 막막한 선생님 있으면 공유해줘.
    reply: |
      면접 준비할 때 '이 샵에 왜 오고 싶은지'를 꼭 준비해. 기술보다 그게 더 궁금하거든.
      원장은 '오래 함께할 사람'을 찾는 거야.
      면접 볼 때 다들은 뭘 제일 어필해?
  - key: interview-real
    title: "🌟 22. 원장은 실력보다 '함께 일할 사람'을 뽑는다"
    category: 창업
    variant: 반전형+비밀공개형
    recommended: true
    topic: "첫 취업/면접(반전): 채용은 기술보다 태도·핏. 비기술 안전주제. 흐름=통념→반전→이유→기준→결론."
    body: |
      면접은 실력 좋은 사람이 붙는 줄 알았어.
      절반만 맞아.

      원장 입장에서 생각해보니 달랐어.
      기술은 가르치면 늘어.
      근데 태도는 잘 안 바뀌어.

      그래서 원장은
      '지금 실력'보다
      '같이 일하고 싶은가'를 더 봐.

      성실한가, 배우려 하나
      손님을 존중하나, 오래 함께할까.

      실력이 조금 부족해도
      함께 크고 싶은 사람을 뽑아.

      면접은 실력 시험이 아니라
      '동료 오디션'이야.

      기술만 준비하는 선생님 있으면 이 글 보여줘.
    reply: |
      실력은 포트폴리오로 이미 보여줘. 면접에선 '태도와 핏'을 보여주는 게 이겨.
      "배우면서 오래 함께하고 싶어요" 이 진심이 세.
      면접에서 제일 긴장되는 질문, 뭐야?
  - key: interview-info
    title: "🌟 22. 속눈썹 면접 준비 4가지"
    category: 창업
    variant: 정보성형+숫자형
    recommended: false
    topic: "첫 취업/면접(정보): 면접 준비 체크리스트. 비기술 안전주제. 저장각=4가지."
    body: |
      면접 붙는 사람은 이 4가지를 준비해.

      1. 포트폴리오
         실력은 말보다 사진. 정리된 작업 몇 개를 준비해.

      2. 지원 이유
         '왜 이 샵'인지. 아무 데나 아니라 여기여야 하는 이유.

      3. 태도 보여주기
         배우려는 자세, 오래 함께할 마음. 이게 결정을 좌우해.

      4. 질문 준비
         궁금한 걸 물어봐. 관심 있는 지원자로 보여.

      기술은 기본, 결정은 태도에서 나.
      취업 준비 중인 선생님 있으면 공유해주고.
    reply: |
      1번(포트폴리오)은 필수야. 말로 "잘해요" 백 번보다 사진 몇 장이 세.
      실력은 보여주고, 면접에선 사람을 보여줘.
      면접 볼 때 뭐 챙겨가? 다들 준비물 궁금해.
  - key: teach-story
    title: "🎓 23. 잘하는 거랑 가르치는 건 완전히 달랐다"
    category: 기술
    variant: 실패경험형+반전형
    recommended: false
    topic: "가르치는 사람으로(스토리): 실력자가 교육으로 넘어갈 때의 벽. 비기술(교육 태도) 안전주제. 흐름=자신→벽→깨달음→방법→결론."
    body: |
      시술은 자신 있으니
      가르치는 것도 쉬울 줄 알았어.

      막상 해보니 완전히 달랐어.

      나한텐 당연한 게
      배우는 사람에겐 하나도 안 당연했어.

      '이건 그냥 이렇게' 하고 넘어가면
      상대는 못 따라왔어.

      잘하는 것과 '설명하는 것'은
      전혀 다른 능력이었어.

      바꾼 건 '내 당연함을 쪼개기'였어.
      손에 익어 건너뛰던 걸
      하나하나 말로 풀었어.

      가르치는 건
      내가 아는 걸 '상대의 눈높이'로 옮기는 일이었어.

      가르치는 게 어려운 선생님 있으면 공유해줘.
    reply: |
      잘 가르치는 법 하나. '내가 초보였을 때 뭘 몰랐지?'를 떠올려봐. 거기가 설명이 필요한 지점이야.
      내 당연함이 상대에겐 벽일 수 있어.
      누구 가르쳐본 적 있어? 뭐가 제일 어려웠어?
  - key: teach-real
    title: "🎓 23. 가르쳐보면 내 실력이 는다"
    category: 기술
    variant: 반전형+비밀공개형
    recommended: true
    topic: "가르치는 사람으로(반전): 가르침이 곧 자기 성장. 비기술 안전주제. 흐름=통념→반전→이유→기준→결론."
    body: |
      가르치면 내 시간만 뺏길 줄 알았어.
      반대였어.

      가르치려면
      내가 '왜 이렇게 하는지'를 설명할 수 있어야 해.

      그런데 막상 설명하려니
      나도 모르게 하던 게 많았어.

      상대에게 풀어주려고 정리하다 보니
      내 기술이 더 선명해졌어.

      감으로 하던 걸
      원리로 이해하게 된 거야.

      가르치는 건 주는 것 같지만
      사실 내가 제일 많이 배워.

      설명할 수 있어야 진짜 아는 거니까.

      성장이 멈춘 것 같은 선생님 있으면 이 글 보여줘.
    reply: |
      꼭 강사 아니어도 돼. 후배 한 명에게 설명해보는 것만으로 내 기술이 정리돼.
      '가르칠 수 있는가'가 진짜 이해의 기준이야.
      누구한테 설명하다 스스로 깨달은 거 있어? 풀어줘.
  - key: teach-info
    title: "🎓 23. 잘 가르치는 4가지"
    category: 기술
    variant: 정보성형+숫자형
    recommended: false
    topic: "가르치는 사람으로(정보): 교육 태도 체크리스트. 비기술 안전주제. 저장각=4가지."
    body: |
      가르치는 것도 기술이야. 이 4가지 기억해.

      1. 당연함을 쪼개기
         나한테 쉬운 걸 건너뛰지 마. 거기가 상대의 벽이야.

      2. 왜인지 설명하기
         '이렇게 해'가 아니라 '이래서 이렇게'. 원리를 줘야 응용해.

