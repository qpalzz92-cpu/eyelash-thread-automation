      친절한 줄 알았지.
      근데 이상하게 재방문이 안 붙더라.

      이유를 나중에 알았어.
      손님은 '자기 눈에 뭐가 어울리는지' 몰라.
      그냥 아는 단어로 말하는 것뿐이야.

