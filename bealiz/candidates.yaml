      냉정하게 말하면
      손님은 '제일 잘하는 곳'이 아니라
      '자기를 챙겨주는 곳'에 남아.

      기억해주는 말 한마디
      때 맞춘 안부 문자 하나
      다음 예약을 잡아주는 습관.

      이 사소한 게 실력보다 재방문을 더 좌우해.

      기술만 파고 관리를 놓으면
      밑 빠진 독에 물 붓는 거야.

      신규만 쫓고 있는 선생님 있으면 이 글 보여줘.
    reply: |
