         초반 매출은 들쭉날쭉해. 생활비를 따로 확보하고 시작해.

      2. 시술 말고 할 일 목록
         예약, 세금, 발주, SNS. 이걸 언제 어떻게 할지 미리 정해.

      3. 첫 손님을 어디서 데려올지
         오픈하면 손님이 온다는 건 착각이야. 초기 유입 경로를 정해둬.

      4. 재방문 시나리오
         온 손님을 어떻게 다시 오게 할지. 이게 없으면 계속 신규만 쫓아.

      이 4개 저장해두고 하나씩 채워봐.
      오픈 준비 중인 선생님 있으면 공유해주고.
    reply: |
      기술 준비는 다들 열심히 하는데 2번(운영)에서 거의 다 무너져.
      시술 외 시간을 어떻게 쓸지 그림이 있어야 몸이 안 갈려.
      다들 창업 준비하면서 제일 막막한 게 뭐야? 하나만 얘기해줘.
  - key: edu-story
    title: "📚 10. 비싼 교육만 찾아다니다 돈만 날렸다"
    category: 창업
    variant: 실패경험형+손해형
    recommended: false
    topic: "교육 선택(스토리): 자격증·비싼 강의 쇼핑하다 실력은 제자리. 6원칙: 훅=실패+손해, 흐름=집착→현실→이유→기준→결론, 공유=교육 고민 예비생, 댓글=교육 후회. 비기술(교육) 안전주제."
    body: |
      실력이 안 늘면 다 교육 탓인 줄 알았어.
      그래서 비싼 강의만 찾아다녔어.

      자격증도 여러 개 땄어.
      근데 실력은 이상하게 제자리였어.

      이유는 뒤늦게 알았어.
      나는 '배우기'만 하고 '익히기'는 안 했던 거야.

      새 걸 배우면 잠깐 뿌듯하고
      또 다음 강의를 결제했어.
      정작 배운 걸 손에 붙이는 시간은 없었어.

      교육은 '개수'가 아니야.
      하나를 배우면 그걸 몸에 밸 때까지 파는 거야.

      강의 쇼핑을 멈추고
      배운 하나를 100번 반복하니 그제야 늘었어.

      교육만 계속 찾고 있는 선생님 있으면 공유해줘.
    reply: |
      새 강의 결제 전에 스스로 물어봐. '지난 교육에서 배운 거, 다 손에 익었나?'
      아니라면 필요한 건 새 강의가 아니라 반복이야.
      다들 들었던 교육 중 제일 도움 된 거 하나만 얘기해줘.
  - key: edu-real
    title: "📚 10. 자격증 개수는 실력이 아니야"
    category: 창업
    variant: 반전형+비밀공개형
    recommended: true
    topic: "교육 선택(반전): 자격증 수집 대신 반복·실전이 실력. 6원칙: 훅=반전, 흐름=통념→반전→이유→기준→결론, 공유=자격증 쇼핑 예비생, 댓글=교육 기준. 비기술 안전주제."
    body: |
      자격증이 많으면 실력자인 줄 알았어.
      아니더라.

      손님은 내 자격증을 안 봐.
      내 '작업 결과'를 봐.

      자격증 열 개보다
      만족해서 다시 오는 단골 한 명이
      내 실력을 더 정확하게 증명해.

      교육은 '입구'일 뿐이야.
      배운 걸 손에 익히고
      실전에서 될 때까지 반복해야 실력이 돼.

      그래서 교육을 고를 땐
      '뭘 배우냐'보다
      '배운 걸 연습하고 피드백받을 수 있냐'를 봐야 해.

      자격증만 모으고 있는 선생님 있으면 이 글 보여줘.
    reply: |
      좋은 교육의 기준 하나. 끝나고 나서도 '질문하고 피드백받을 수 있는가'.
      한 번 듣고 끝인 강의는 배운 게 손에 안 남아.
      다들 교육 고를 때 뭘 제일 봐? 기준 하나만 얘기해줘.
  - key: edu-info
    title: "📚 10. 교육 고를 때 볼 4가지"
    category: 창업
    variant: 정보성형+숫자형
    recommended: false
    topic: "교육 선택(정보): 교육 선택 체크리스트. 저장각. 6원칙: 훅=정보, 저장각=4체크, 공유=교육 고민 예비생, 댓글=제일 중요하게 보는 것. 비기술 안전주제."
    body: |
      교육은 비싸다고 좋은 게 아니야.
      고를 때 이 4가지를 봐.

      1. 실습 비중
         이론만 길고 실습이 적으면 손에 안 남아. 직접 해보는 시간이 중요해.

      2. 사후 피드백이 되나
         끝나고도 질문하고 봐줄 수 있는 곳. 한 번 듣고 끝은 금방 잊혀져.

      3. 내 단계에 맞나
         왕초보인데 고급반, 실무자인데 기초반. 단계가 안 맞으면 돈 낭비야.

      4. 실제 후기(작업 결과)
         화려한 홍보 말고, 수강생의 '전후 실력'을 봐.

      이 4개 저장해두고 강의 비교할 때 대봐.
      교육 고민 중인 선생님 있으면 공유해주고.
    reply: |
      제일 중요한 건 2번(사후 피드백)이야. 배움은 '듣는 순간'이 아니라 '해보고 막힐 때' 완성되거든.
      그때 물어볼 데가 있느냐가 실력 차이를 만들어.
      다들 교육 고를 때 제일 중요하게 보는 거 하나만 얘기해줘.
